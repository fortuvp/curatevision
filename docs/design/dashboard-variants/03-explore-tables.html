<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Explore · CurateVision</title>
<meta name="description" content="Which Curate lists are big, which are busy, which are contested: sortable tables of registries and curators, computed from a real on-chain snapshot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Urbanist:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070a;
  --surface:rgba(13,15,21,.74);
  --thead:#0c0e13;
  --row:#0b0d12;
  --tfoot:#0f1218;
  --sheet:#0b0d12;
  --tip:#141720;
  --hover:rgba(255,255,255,.035);
  --chip:rgba(255,255,255,.06);
  --chip-2:rgba(255,255,255,.09);
  --field:rgba(255,255,255,.035);
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.13);
  --text:#eef1f7;
  --text-2:#a3abbb;
  --text-3:#7d8699;
  --accent:#4f8dff;
  --accent-hi:#86b0ff;
  --accent-soft:rgba(79,141,255,.13);
  --accent-line:rgba(79,141,255,.42);
  --accent-glow:rgba(79,141,255,.55);
  --amber:#f2b04f;
  --amber-soft:rgba(242,176,79,.13);
  --green:#43d39b;
  --green-soft:rgba(67,211,155,.12);
  --red:#f26d7e;
  --red-soft:rgba(242,109,126,.12);
  --eth:#8f9dff;
  --gno:#3cc4a0;
  --shadow:0 30px 80px rgba(0,0,0,.55);
  --bloom-a:rgba(56,112,255,.34);
  --bloom-b:rgba(122,96,255,.16);
  --bloom-c:rgba(36,170,255,.12);
  --mo-bg1:29%;--mo-bg2:14%;--mo-fg:85%;
  --nav-h:64px;
  --f-ui:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-d:'Urbanist','Geist',ui-sans-serif,system-ui,sans-serif;
  --f-m:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.2,.75,.2,1);
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#f4f6f9;
  --surface:rgba(255,255,255,.8);
  --thead:#fbfcfd;
  --row:#fcfdfd;
  --tfoot:#f3f5f8;
  --sheet:#ffffff;
  --tip:#ffffff;
  --hover:rgba(16,32,64,.035);
  --chip:rgba(16,32,64,.06);
  --chip-2:rgba(16,32,64,.09);
  --field:#ffffff;
  --line:rgba(16,26,46,.09);
  --line-2:rgba(16,26,46,.15);
  --text:#0b0f17;
  --text-2:#4a5366;
  --text-3:#687185;
  --accent:#2b66f6;
  --accent-hi:#6f9bff;
  --accent-soft:rgba(43,102,246,.09);
  --accent-line:rgba(43,102,246,.38);
  --accent-glow:rgba(43,102,246,.32);
  --amber:#c47f0e;
  --amber-soft:rgba(214,140,20,.12);
  --green:#119f69;
  --green-soft:rgba(17,159,105,.1);
  --red:#d6435a;
  --red-soft:rgba(214,67,90,.09);
  --eth:#5a6bff;
  --gno:#0f9a76;
  --shadow:0 30px 80px rgba(20,30,60,.18);
  --bloom-a:rgba(70,120,255,.22);
  --bloom-b:rgba(140,110,255,.12);
  --bloom-c:rgba(40,170,255,.1);
  --mo-bg1:94%;--mo-bg2:87%;--mo-fg:36%;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:400 14px/1.45 var(--f-ui);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;transition:background-color .3s var(--ease),color .3s var(--ease)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--f-m);font-size:13px;letter-spacing:-.01em}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* bloom */
.bloom{position:absolute;inset:0 0 auto 0;height:820px;pointer-events:none;z-index:0;
  background:
    radial-gradient(46% 56% at 50% -6%,var(--bloom-a) 0%,transparent 72%),
    radial-gradient(30% 40% at 82% 2%,var(--bloom-b),transparent 70%),
    radial-gradient(26% 34% at 16% 10%,var(--bloom-c),transparent 70%);
  -webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}

/* nav */
.nav{position:sticky;top:0;z-index:30;height:var(--nav-h);transition:background-color .25s,border-color .25s,backdrop-filter .25s;border-bottom:1px solid transparent}
.nav.scrolled{background:color-mix(in oklab,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border-bottom-color:var(--line)}
.nav-in{max-width:1304px;margin:0 auto;height:100%;padding:0 32px;display:flex;align-items:center;gap:36px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px/1 var(--f-d);letter-spacing:-.01em}
.brand-mark{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,#6aa4ff,#2f5cf5 70%);box-shadow:0 6px 18px -6px rgba(60,110,255,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.links{display:flex;gap:4px}
.links a{padding:8px 12px;border-radius:12px;color:var(--text-3);font-weight:500;font-size:14.5px;transition:color .2s,background-color .2s}
.links a:hover{color:var(--text);background:var(--hover)}
.links a.on{color:var(--text)}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.scope{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;border-radius:12px;background:var(--chip);color:var(--text-2);font-size:13px;font-weight:500;white-space:nowrap}
.scope .dots{display:flex}
.scope .dots i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg)}
.scope .dots i+i{margin-left:-3px}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);background:var(--chip);transition:color .2s,background-color .2s}
.icon-btn:hover{color:var(--text);background:var(--chip-2)}
.icon-btn svg{width:18px;height:18px}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 22px -10px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.22);transition:filter .2s,transform .2s}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:active{transform:translateY(1px)}

/* layout */
.wrap{position:relative;z-index:1;max-width:1304px;margin:0 auto;padding:0 32px 72px}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:36px 0 22px}
.hero h1{font:600 44px/1 var(--f-d);letter-spacing:-.025em}
.lede{margin-top:10px;color:var(--text-2);font-size:15px;max-width:56ch}
.snap{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--text-2);font:500 12px/1 var(--f-m);white-space:nowrap}
.snap i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}

.panel{position:relative;border:1px solid var(--line);border-radius:22px;background:var(--surface);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* stats ribbon: two 30-day sparklines + three table-wide facts */
.ribbon{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) repeat(3,minmax(0,1fr));overflow:hidden}
.ribbon::before{content:"";position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent-line),transparent);pointer-events:none}
.rc{position:relative;display:flex;flex-direction:column;min-width:0;padding:18px 20px 16px}
.rc+.rc{border-left:1px solid var(--line)}
.rl{display:flex;align-items:center;gap:7px;color:var(--text-2);font-size:12.5px;font-weight:500;white-space:nowrap}
.rl .w{color:var(--text-3);font-weight:400}
.rl .sw{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.rv{margin-top:8px;font:600 34px/1 var(--f-d);letter-spacing:-.025em}
.spark{position:relative;margin-top:12px;height:46px;outline:none;border-radius:8px;cursor:crosshair;touch-action:pan-y;-webkit-tap-highlight-color:transparent}
.spark:focus-visible{box-shadow:0 0 0 2px var(--accent-line)}
.spark svg{display:block;width:100%;height:46px;overflow:visible}
.spark .ln{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--cg))}
.spark .ar{opacity:.9}
.spark .bl{stroke:var(--line-2);stroke-width:1}
.spark .hd{fill:var(--c);stroke:var(--row);stroke-width:2;opacity:0;transition:opacity .12s}
.spark .hx{stroke:var(--text);stroke-opacity:.35;stroke-width:1;opacity:0;transition:opacity .12s}
.spark.on .hd,.spark.on .hx{opacity:1}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.anim-ok .spark.intro .ln{stroke-dasharray:var(--len);animation:draw 1.1s var(--ease) .25s both}
.anim-ok .spark.intro .ar{animation:fadeIn .8s var(--ease) .7s both}
.rcap{margin-top:8px;color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
.rcap b{color:var(--text);font-weight:500}
.ans{cursor:pointer;text-align:left;transition:background-color .18s}
.ans:hover{background:var(--hover)}
.ans:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent-line);border-radius:0}
.ans .arr{position:absolute;top:17px;right:16px;width:15px;height:15px;color:var(--text-3);opacity:0;transform:translate(-3px,3px);transition:opacity .2s,transform .2s var(--ease)}
.ans:hover .arr,.ans:focus-visible .arr{opacity:1;transform:none}
.ans[aria-pressed="true"]{background:var(--accent-soft)}
.ans[aria-pressed="true"]::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.an-v{margin-top:8px;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.an-v b{font:600 34px/1 var(--f-d);letter-spacing:-.025em}
.an-v span{color:var(--text-2);font-size:13px}
.ticks{display:flex;gap:3px;margin-top:auto;padding-top:14px;width:100%}
.ticks i{flex:1 1 0;max-width:14px;height:16px;border-radius:4px;background:var(--chip-2)}
.ticks i.on{background:var(--c);box-shadow:0 0 9px -3px var(--c)}
@keyframes tickIn{from{opacity:0;transform:scaleY(.35)}to{opacity:1;transform:none}}
.anim-ok .ticks i.on{animation:tickIn .45s var(--ease) both;animation-delay:calc(.35s + var(--i) * 32ms)}
.an-s{margin-top:8px;min-height:34px;color:var(--text-3);font-size:12px;line-height:1.4}
.an-s .cl{display:block}
.an-s .cs{display:none}
.an-s b{color:var(--text-2);font-weight:500}
.fn{margin:10px 4px 0;color:var(--text-3);font-size:12px;line-height:1.55;max-width:132ch}
.fn b{color:var(--text-2);font-weight:500}
.fn i{font-style:normal;color:var(--text-2)}

/* explorer bar */
.explorer{margin-top:40px}
.xbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line)}
.tabs{position:relative;display:flex;gap:30px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:9px;padding:6px 0 16px;font:600 21px/1 var(--f-d);letter-spacing:-.01em;color:var(--text-3);white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--text-2)}
.tab[aria-selected="true"]{color:var(--text)}
.cnt{font:500 11.5px/1 var(--f-m);padding:4px 7px;border-radius:99px;background:var(--chip);color:var(--text-3);letter-spacing:0;transition:background-color .2s,color .2s}
.tab[aria-selected="true"] .cnt{background:var(--accent-soft);color:var(--accent)}
.ind{position:absolute;left:0;bottom:0;height:2px;width:0;border-radius:2px;background:var(--accent);box-shadow:0 0 10px 0 var(--accent-glow),0 -4px 16px 0 var(--accent-soft);pointer-events:none}
.search{display:flex;align-items:center;gap:9px;height:42px;width:320px;flex:none;margin-bottom:12px;padding:0 10px 0 13px;border-radius:14px;background:var(--field);border:1px solid var(--line);color:var(--text-3);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{width:17px;height:17px;flex:none}
.search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px}
.search input::placeholder{color:var(--text-3)}
.search input::-webkit-search-cancel-button{display:none}
kbd{font:500 11px/1 var(--f-m);padding:4px 7px;border-radius:7px;border:1px solid var(--line-2);color:var(--text-3)}
.clear-q{display:none;width:24px;height:24px;border-radius:8px;place-items:center;color:var(--text-3)}
.clear-q:hover{color:var(--text);background:var(--chip)}
.search.has .clear-q{display:grid}
.search.has kbd{display:none}

/* chips */
.chips{display:flex;align-items:center;gap:8px 16px;padding:16px 0 14px}
.crow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--text-2);font-size:13px;font-weight:500;white-space:nowrap;transition:background-color .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--line-2);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--text)}
.chip[aria-disabled="true"]{opacity:.42;pointer-events:none}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip .c{font:500 11.5px/1 var(--f-m);color:var(--text-3)}
.chip[aria-pressed="true"] .c{color:var(--accent)}
.chip .ck{width:14px;height:14px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:background-color .2s,border-color .2s}
.chip .ck svg{width:10px;height:10px;opacity:0;color:#fff}
.chip[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.chip[aria-pressed="true"] .ck svg{opacity:1}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.clabel{color:var(--text-3);font-size:12.5px;font-weight:500;margin-right:2px;white-space:nowrap}
.meta{margin-left:auto;color:var(--text-3);font-size:12.5px;white-space:nowrap}

/* table */
.tcard{border:1px solid var(--line);border-radius:20px;background:var(--surface);overflow:clip}
.tscroll{position:relative}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px}
.t caption{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.t th{position:sticky;top:var(--nav-h);z-index:3;background:var(--thead);text-align:left;vertical-align:bottom;padding:11px 14px 10px;border-bottom:1px solid var(--line);color:var(--text-3);font-size:12.5px;font-weight:500;white-space:nowrap}
.t td{padding:0 14px;height:64px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.t th:first-child,.t td:first-child{padding-left:22px}
.t th:last-child,.t td:last-child{padding-right:22px}
.t .n{text-align:right}
.t tbody tr{transition:background-color .15s}
.t tbody tr:hover{background:var(--hover)}
.t tfoot tr.flash td{animation:flashF 1.6s var(--ease)}
@keyframes flashF{0%,30%{background:var(--accent-soft)}100%{background:var(--tfoot)}}
.t tfoot td{height:56px;background:var(--tfoot);border-bottom:0;border-top:1px solid var(--line-2);font-weight:600}
.t tbody tr:last-child td{border-bottom:0}
.th-b{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;color:inherit;font-weight:500;padding:2px 0;text-align:left;transition:color .15s}
.n .th-b{align-items:flex-end;text-align:right}
.th-b:hover,.th-b.on{color:var(--text)}
.th-l{display:inline-flex;align-items:center;gap:4px}
.th-l svg{width:11px;height:11px;flex:none;opacity:0;transition:transform .2s,opacity .15s}
.th-b:hover .th-l svg{opacity:.5}
.th-b.on .th-l svg{opacity:1}
.th-b.asc .th-l svg{transform:rotate(180deg)}
.th-f{font-size:11px;font-weight:400;color:var(--text-3);letter-spacing:0}
.th-b.on .th-f{color:var(--text-2)}
.ent{display:flex;align-items:center;gap:12px;min-width:0}
.ent-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.ent-n{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.ent-s{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:12.5px;white-space:nowrap}
.dotc{display:inline-flex;align-items:center;gap:6px}
.dotc i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.kind{font:500 11px/1 var(--f-m);padding:3px 6px;border-radius:6px;background:var(--chip);color:var(--text-2);letter-spacing:0}
.ver{width:15px;height:15px;color:var(--accent);flex:none}
.vbadge{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:500;font-size:13.5px}
.cellbar{display:inline-flex;flex-direction:column;align-items:flex-end;gap:6px}
.cellbar .bar{width:88px;height:4px;border-radius:99px;background:var(--chip);overflow:hidden}
.cellbar .bar i{display:block;height:100%;margin-left:auto;border-radius:99px;background:linear-gradient(270deg,var(--accent-hi),var(--accent));box-shadow:0 0 8px var(--accent-glow);min-width:2px}
.sub2{display:block;margin-top:3px;color:var(--text-3);font-size:12px;font-weight:400}
.muted{color:var(--text-3)}
.hl{color:var(--accent);font-weight:500}
.am{color:var(--amber);font-weight:500}
.who{display:inline-flex;align-items:center;gap:10px;min-width:0}
.orb{--s:28px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-block;
  background:radial-gradient(circle at var(--x) var(--y),hsl(var(--h1) 95% 82% / .95) 0,transparent 42%),
    conic-gradient(from var(--a) at 60% 62%,hsl(var(--h1) 72% 56%),hsl(var(--h2) 70% 46%),hsl(var(--h1) 64% 34%),hsl(var(--h1) 72% 56%));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -4px 10px rgba(0,0,0,.22)}
.mo{--s:34px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;font:700 12.5px/1 var(--f-d);letter-spacing:.01em;color:hsl(var(--h) 85% var(--mo-fg));background:radial-gradient(120% 120% at 28% 18%,hsl(var(--h) 62% var(--mo-bg1)),hsl(var(--h) 50% var(--mo-bg2)));box-shadow:inset 0 0 0 1px hsl(var(--h) 70% 62% / .25)}
.mo.x3{font-size:10.5px}
.mo.mut{color:var(--text-2);background:var(--chip);box-shadow:inset 0 0 0 1px var(--line-2)}
.mono{font-family:var(--f-m);font-size:13.5px;letter-spacing:-.01em}
.empty{padding:48px 24px;text-align:center;color:var(--text-2)}
.empty p{margin-bottom:14px}
.pill-ghost{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line-2);color:var(--text-2);font-size:13px;font-weight:500;white-space:nowrap;transition:background-color .2s,color .2s}
.pill-ghost:hover{color:var(--text);background:var(--chip)}

/* motion */
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim-ok .t.anim tbody tr{animation:rowIn .46s var(--ease) both;animation-delay:calc(var(--i) * 24ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

<script>
(function(){
'use strict';
var S = window.CURATE_SNAPSHOT;
if (!S) { document.getElementById('tscroll').innerHTML = '<div class="empty"><p>snapshot.js did not load.</p></div>'; return; }

/* ---------- helpers ---------- */
const doc = document, root = doc.documentElement;
const $ = (s, r = doc) => r.querySelector(s);
const RM = window.matchMedia('(prefers-reduced-motion: reduce)');
const SNAP = Math.floor(Date.parse(S.snapshotAt) / 1000);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const NF = new Intl.NumberFormat('en-US');
const f = n => NF.format(n);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D = ts => new Date(ts * 1000);
const dayMon = ts => { const d = D(ts); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
const dateFull = ts => { const d = D(ts); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
const hhmm = ts => pad(D(ts).getUTCHours()) + ':' + pad(D(ts).getUTCMinutes());
const dateTime = ts => dateFull(ts) + ', ' + hhmm(ts) + ' UTC';
const plural = (n, a, b) => n === 1 ? a : b;
const sum = (rows, k) => rows.reduce((a, r) => a + r[k], 0);
const pct1 = x => (x * 100).toFixed(1) + '%';
function hash(str){ let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

/* ---------- icons + identity marks ---------- */
const IC = {
  sun: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v1.8M10 15.7v1.8M2.5 10h1.8M15.7 10h1.8M4.7 4.7l1.3 1.3M14 14l1.3 1.3M4.7 15.3 6 14M14 6l1.3-1.3"/></svg>',
  moon: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M16 12.3A6.5 6.5 0 0 1 7.7 4a6.5 6.5 0 1 0 8.3 8.3Z"/></svg>',
  sort: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5v7M3 6.5l3 3 3-3"/></svg>',
  check: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.6l4.5-5"/></svg>',
  arr: '<svg class="arr" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11 11 5M6.2 5H11v4.8"/></svg>'
};
const VER = (() => { let p = ''; for (let i = 0; i < 24; i++){ const a = Math.PI * 2 * i / 24 - Math.PI / 2, r = i % 2 ? 6.4 : 7.5; p += (i ? 'L' : 'M') + (8 + r * Math.cos(a)).toFixed(2) + ' ' + (8 + r * Math.sin(a)).toFixed(2); } return '<svg class="ver" viewBox="0 0 16 16" aria-hidden="true"><path d="' + p + 'Z" fill="currentColor"/><path d="M5.3 8.2l1.8 1.8 3.6-3.7" fill="none" style="stroke:#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'; })();
function blockie(seed, size){
  const r = rng(hash(String(seed).toLowerCase()) + 7);
  const h1 = Math.floor(r() * 360), h2 = (h1 + 40 + Math.floor(r() * 140)) % 360;
  const x = 22 + Math.floor(r() * 30), y = 18 + Math.floor(r() * 30), a = Math.floor(r() * 360);
  return '<span class="orb" style="--s:' + (size || 28) + 'px;--h1:' + h1 + ';--h2:' + h2 + ';--x:' + x + '%;--y:' + y + '%;--a:' + a + 'deg" aria-hidden="true"></span>';
}
const HUES = [216, 228, 200, 246, 188, 258, 208, 236];
function initials(t){
  const ac = /\(([A-Z]{2,4})\)/.exec(t); if (ac) return ac[1];
  const w = t.replace(/\(.*?\)/g, ' ').split(/[\s\-]+/).filter(x => x && /^[A-Za-z]/.test(x) && !/^(registry|the|of|v\d+)$/i.test(x));
  return ((w[0] || '?')[0] + ((w[1] || '')[0] || '')).toUpperCase();
}
function mono(r, cls){
  const ini = initials(r.title), h = HUES[hash(r.title + (r.created || '')) % HUES.length];
  return '<span class="mo ' + (cls || '') + (ini.length > 2 ? ' x3' : '') + (r.verified === false ? ' mut' : '') + '" style="--h:' + h + '" aria-hidden="true">' + ini + '</span>';
}
const CHAIN_C = { Ethereum: 'var(--eth)', Gnosis: 'var(--gno)' };

/* ---------- data: everything below is derived from the snapshot ---------- */
const F = S.figures;
const SER = S.series30d, LAST = SER.length - 1;
const REQ30 = sum(SER, 'requests');                 /* Σ daily requests */
const CH30 = sum(SER, 'challenges');                /* Σ daily challenges */
const PARTIAL = SNAP - SER[LAST].day < 86400;       /* snapshot falls inside the last day */
const WINDOW = dayMon(SER[0].day) + ' – ' + dateFull(SER[LAST].day);
const SNAPLABEL = dateTime(SNAP);
const REG = S.topRegistries.map((r, i) => Object.assign({}, r, {
  key: 'r' + i,
  createdTs: Date.parse(r.created + 'T00:00:00Z') / 1000,
  year: +String(r.created).slice(0, 4)
}));
const MAXE = Math.max.apply(null, REG.map(r => r.entries));
const CUR = S.curators.map((u, i) => Object.assign({}, u, { key: 'u' + i, rate: u.challenges > 0 ? u.won / u.challenges : null })); /* won ÷ challenges */
const SUBALL = sum(CUR, 'submissions');
CUR.forEach(u => { u.subShare = SUBALL > 0 ? u.submissions / SUBALL : 0; }); /* submissions ÷ Σ submissions */
const MAXS = Math.max.apply(null, CUR.map(u => u.submissions));
const BYKEY = {}; REG.forEach(r => { BYKEY[r.key] = r; });

/* ---------- stats ribbon ---------- */
/* table-wide facts over the listed registries: counts and sums, no per-list leader */
const NREG = REG.length;
const OPEN_ALL = sum(REG, 'open');                                    /* Σ open, listed rows */
const WITH_OPEN = REG.filter(r => r.open > 0);                        /* rows with open > 0 */
const HELD = sum(WITH_OPEN, 'open');                                  /* Σ open of those rows */
const IDLE = NREG - WITH_OPEN.length;                                 /* rows with open = 0 */
const VER_ROWS = REG.filter(r => r.verified);
const E_ALL = sum(REG, 'entries'), E_VER = sum(VER_ROWS, 'entries');  /* Σ entries, all / verified rows */
const GNO_ROWS = REG.filter(r => r.chain === 'Gnosis');
const G_OPEN = sum(GNO_ROWS, 'open');                                 /* Σ open on Gnosis rows */
const NOT_G = REG.filter(r => r.chain !== 'Gnosis');
const NOT_G_CHAINS = Array.from(new Set(NOT_G.map(r => r.chain))).join(' + ');
const ofAll = (a, b) => a === b ? 'all ' + f(b) : f(a) + ' of ' + f(b);
const ribbon = $('#ribbon');
function sparkCell(key, label, total, c, cg){
  return '<div class="rc spc" style="--c:' + c + ';--cg:' + cg + '">' +
    '<span class="rl"><i class="sw"></i>' + label + ' <span class="w">· 30 days</span></span>' +
    '<span class="rv num" data-count="' + total + '">' + f(total) + '</span>' +
    '<div class="spark" id="sp-' + key + '" data-key="' + key + '" tabindex="0" role="group" aria-roledescription="sparkline" aria-label="' + label + ' per day, ' + WINDOW + '. Arrow keys read each day." aria-describedby="cap-' + key + '"></div>' +
    '<span class="rcap" id="cap-' + key + '" aria-live="polite"></span></div>';
}
/* one mark per listed registry, in the table's default order (most entries first); lit = counted by the fact */
const ticks = (test, c) => '<span class="ticks" style="--c:' + c + '" aria-hidden="true">' +
  REG.map((r, i) => '<i' + (test(r) ? ' class="on"' : '') + ' style="--i:' + i + '" title="' + esc(r.title + ' · ' + r.chain + ' · ' + f(r.open) + ' open' + (r.verified ? ' · verified' : '')) + '"></i>').join('') + '</span>';
function factCell(act, label, n, unit, mark, sub, aria){
  return '<button class="rc ans" type="button" data-act="' + act + '" aria-pressed="false" aria-label="' + esc(aria) + '">' + IC.arr +
    '<span class="rl">' + label + '</span>' +
    '<span class="an-v"><b class="num">' + f(n) + '</b><span>' + unit + '</span></span>' +
    mark +
    '<span class="an-s">' + sub.map((c, i) => '<span class="cl">' + (i ? '<span class="cs"> · </span>' : '') + c + '</span>').join('') + '</span></button>';
}
ribbon.innerHTML =
  sparkCell('requests', 'Requests', REQ30, 'var(--accent)', 'var(--accent-glow)') +
  sparkCell('challenges', 'Challenges', CH30, 'var(--amber)', 'var(--amber-soft)') +
  factCell('open', 'Where open requests sit', WITH_OPEN.length, 'of ' + NREG + ' lists',
    ticks(r => r.open > 0, 'var(--accent)'),
    ['hold <b class="num">' + ofAll(HELD, F.requestsOpen) + '</b> open', 'the other <b class="num">' + IDLE + '</b> ' + plural(IDLE, 'has', 'have') + ' zero open'],
    WITH_OPEN.length + ' of ' + NREG + ' lists hold ' + ofAll(HELD, F.requestsOpen) + ' open requests; ' + IDLE + ' have none. Show those ' + WITH_OPEN.length + ' in the table') +
  factCell('verified', 'Verified by Kleros', VER_ROWS.length, 'of ' + NREG + ' lists',
    ticks(r => r.verified, 'var(--accent)'),
    ['hold <b class="num">' + pct1(E_ALL ? E_VER / E_ALL : 0) + '</b> of the ' + f(E_ALL) + ' entries', 'the other <b class="num">' + (NREG - VER_ROWS.length) + '</b> hold ' + f(E_ALL - E_VER)],
    VER_ROWS.length + ' of ' + NREG + ' lists are verified by Kleros, holding ' + pct1(E_ALL ? E_VER / E_ALL : 0) + ' of the ' + f(E_ALL) + ' entries. Show them in the table') +
  factCell('gnosis', 'On Gnosis', GNO_ROWS.length, 'of ' + NREG + ' lists',
    ticks(r => r.chain === 'Gnosis', 'var(--gno)'),
    ['hold <b class="num">' + ofAll(G_OPEN, OPEN_ALL) + '</b> open'].concat(NOT_G.length ? ['the <b class="num">' + NOT_G.length + '</b> on ' + NOT_G_CHAINS + ' hold ' + (OPEN_ALL - G_OPEN ? f(OPEN_ALL - G_OPEN) : 'none')] : []),
    GNO_ROWS.length + ' of ' + NREG + ' lists are on Gnosis, with ' + ofAll(G_OPEN, OPEN_ALL) + ' open requests. Show them in the table');
$('#ribbon-fn').innerHTML =
  '<b>Requests</b> and <b>challenges</b> = sum of the daily counts, ' + WINDOW + ' (' + SER.length + ' UTC days' + (PARTIAL ? ', the last one partial to ' + hhmm(SNAP) + ' UTC' : '') + '), Ethereum + Gnosis; each sparkline plots the daily count, scaled to its own peak. ' +
  'The three facts count the top ' + NREG + ' registries by entries at the snapshot (the table below): <b>where open requests sit</b> = lists with open &gt; 0, and their Σ open against the ' + f(F.requestsOpen) + ' requests open across all ' + f(F.registries) + ' registries; ' +
  '<b>verified</b> = lists verified by Kleros, and their Σ entries ÷ Σ entries of all ' + NREG + ' (' + f(E_VER) + ' ÷ ' + f(E_ALL) + '); <b>on Gnosis</b> = lists on Gnosis, and their Σ open against Σ open of all ' + NREG + '; <b>the other</b> = the remaining lists and their remaining sum. ' +
  'Each row of ' + NREG + ' marks = the ' + NREG + ' lists in table order, most entries first; a lit mark = a list the fact counts. Click a fact to filter the table to it.';

/* sparklines */
const capDefault = key => '<span class="lg-only">' + (key === 'requests' ? 'Requests' : 'Challenges') + ' </span>per day · ' + dayMon(SER[0].day) + ' – ' + dayMon(SER[LAST].day);
function drawSpark(el){
  const W = Math.floor(el.clientWidth), H = Math.floor(el.clientHeight) || 46; if (!W) return;
  const sig = W + 'x' + H; if (el._sig === sig) return; el._sig = sig;
  const key = el.dataset.key, vals = SER.map(d => d[key]), n = vals.length;
  const max = Math.max(1, Math.max.apply(null, vals)), P = 3;
  const x = i => P + i * (W - 2 * P) / (n - 1), y = v => P + (H - 2 * P) * (1 - v / max);
  let d = ''; vals.forEach((v, i) => { d += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); });
  const area = d + 'L' + x(n - 1).toFixed(1) + ' ' + (H - P) + 'L' + x(0).toFixed(1) + ' ' + (H - P) + 'Z';
  const first = !el._drawn;
  el.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><defs><linearGradient id="g-' + key + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--c);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--c);stop-opacity:0"/></linearGradient></defs>' +
    '<line class="bl" x1="0" x2="' + W + '" y1="' + (H - P + .5) + '" y2="' + (H - P + .5) + '"/>' +
    '<path class="ar" d="' + area + '" fill="url(#g-' + key + ')"/><path class="ln" d="' + d + '"/>' +
    '<line class="hx" x1="0" x2="0" y1="0" y2="' + H + '"/><circle class="hd" r="3.5" cx="0" cy="0"/></svg>';
  const ln = el.querySelector('.ln'); try { ln.style.setProperty('--len', Math.ceil(ln.getTotalLength())); } catch (e) {}
  el._geo = { x, y, W, P, n };
  el.classList.toggle('intro', first); el._drawn = true;
  sparkSel(el, el._sel == null ? -1 : el._sel, true);
}
function sparkSel(el, i, force){
  if (i === el._sel && !force) return;
  el._sel = i;
  const key = el.dataset.key, cap = $('#cap-' + key), g = el._geo;
  el.classList.toggle('on', i >= 0);
  if (i < 0 || !g){ cap.innerHTML = capDefault(key); return; }
  const v = SER[i][key], cx = g.x(i).toFixed(1);
  const hd = el.querySelector('.hd'), hx = el.querySelector('.hx');
  hd.setAttribute('cx', cx); hd.setAttribute('cy', g.y(v).toFixed(1)); hx.setAttribute('x1', cx); hx.setAttribute('x2', cx);
  cap.innerHTML = WD[D(SER[i].day).getUTCDay()] + ' ' + dayMon(SER[i].day) + (i === LAST && PARTIAL ? ' (to ' + hhmm(SNAP) + ')' : '') + ' · <b class="num">' + f(v) + '</b> ' + plural(v, key === 'requests' ? 'request' : 'challenge', key);
}
const sparks = Array.from(doc.querySelectorAll('.spark'));
sparks.forEach(el => {
  const idx = e => { const g = el._geo, r = el.getBoundingClientRect(); return Math.max(0, Math.min(g.n - 1, Math.round((e.clientX - r.left - g.P) / (g.W - 2 * g.P) * (g.n - 1)))); };
  el.addEventListener('pointermove', e => { if (el._geo) sparkSel(el, idx(e)); });
  el.addEventListener('pointerdown', e => { if (el._geo) sparkSel(el, idx(e)); });
  el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') sparkSel(el, -1); });
  el.addEventListener('blur', () => sparkSel(el, -1));
  el.addEventListener('keydown', e => {
    const s = el._sel == null ? -1 : el._sel; let i = null;
    if (e.key === 'ArrowRight') i = s < 0 ? 0 : Math.min(LAST, s + 1);
    else if (e.key === 'ArrowLeft') i = s < 0 ? LAST : Math.max(0, s - 1);
    else if (e.key === 'Home') i = 0; else if (e.key === 'End') i = LAST;
    else if (e.key === 'Escape') i = -1;
    if (i !== null){ e.preventDefault(); sparkSel(el, i); }
  });
});
doc.addEventListener('pointerdown', e => { sparks.forEach(el => { if (e.pointerType !== 'mouse' && !el.contains(e.target)) sparkSel(el, -1); }); });
function countUp(el){
  const to = +el.dataset.count;
  if (!root.classList.contains('anim-ok') || !to) return;
  const t0 = performance.now(), dur = 900;
  const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = f(Math.round(to * e)); if (p < 1) requestAnimationFrame(step); else el.textContent = f(to); };
  requestAnimationFrame(step);
}
doc.querySelectorAll('[data-count]').forEach(countUp);

/* ---------- tables ---------- */
const bar = (v, max, title) => '<span class="bar" title="' + esc(title) + '"><i style="width:' + (max ? v / max * 100 : 0).toFixed(2) + '%"></i></span>';
function regCell(r){
  return '<div class="ent">' + mono(r) + '<div class="ent-t"><span class="ent-n" title="' + esc(r.title) + '">' + esc(r.title) + '</span><span class="ent-s"><span class="kind">' + esc(r.kind.toLowerCase()) + '</span><span class="dotc"><i style="--c:' + (CHAIN_C[r.chain] || 'var(--text-3)') + '"></i>' + esc(r.chain) + '</span></span></div></div>';
}
const TABS = {
  registries: {
    label: 'Registries', rows: REG, chains: true, ph: 'Search registries',
    caption: 'Top registries by entries, sortable',
    text: r => r.title + ' ' + r.kind + ' ' + r.chain,
    toggles: [{ k: 'verified', label: 'Verified by Kleros', test: r => r.verified }, { k: 'hasopen', label: 'Has open requests', test: r => r.open > 0 }],
    meta: n => 'Top ' + REG.length + ' of ' + f(F.registries) + ' registries by entries' + (n !== REG.length ? ' · ' + n + ' shown' : ''),
    sort: { k: 'entries', dir: -1 },
    cols: [
      { k: 'name', label: 'Registry', fx: 'kind · chain', sort: r => r.title.toLowerCase(), cell: regCell,
        total: rows => 'Total<span class="sub2">' + rows.length + ' ' + plural(rows.length, 'registry', 'registries') + ' shown</span>' },
      { k: 'entries', label: 'Entries', fx: 'at snapshot', n: 1, sort: r => r.entries,
        cell: r => '<span class="cellbar"><span class="num">' + f(r.entries) + '</span>' + bar(r.entries, MAXE, 'Entries ÷ ' + f(MAXE) + ' (largest list)') + '</span>',
        total: rows => '<span class="num">' + f(sum(rows, 'entries')) + '</span>' },
      { k: 'open', label: 'Open', fx: 'requests now', n: 1, sort: r => r.open,
        cell: r => '<span class="num ' + (r.open ? 'hl' : 'muted') + '">' + f(r.open) + '</span>',
        total: rows => '<span class="num">' + f(sum(rows, 'open')) + '</span>' },
      { k: 'court', label: 'In court', fx: 'disputes now', n: 1, sort: r => r.inCourt,
        cell: r => '<span class="num ' + (r.inCourt ? 'am' : 'muted') + '">' + f(r.inCourt) + '</span>',
        total: rows => '<span class="num">' + f(sum(rows, 'inCourt')) + '</span>' },
      { k: 'verified', label: 'Verified', fx: 'by Kleros', sort: r => r.verified ? 1 : 0,
        cell: r => r.verified ? '<span class="vbadge">' + VER + 'Yes</span>' : '<span class="muted">No</span>',
        total: rows => '<span class="num">' + rows.filter(r => r.verified).length + ' of ' + rows.length + '</span>' },
      { k: 'created', label: 'Created', fx: 'year', n: 1, sort: r => r.createdTs,
        cell: r => '<span class="num" style="color:var(--text-2)">' + r.year + '</span>',
        total: rows => { const ys = rows.map(r => r.year), a = Math.min.apply(null, ys), b = Math.max.apply(null, ys); return '<span class="num">' + (a === b ? a : a + '–' + b) + '</span>'; } }
    ],
    fn: () => 'Snapshot ' + SNAPLABEL + ' · top ' + REG.length + ' of ' + f(F.registries) + ' registries by entries, Ethereum + Gnosis. ' +
      '<b>Open</b> = requests open to challenge and <b>in court</b> = disputes open in Kleros Court, both at the snapshot. ' +
      'The bar under entries = entries ÷ ' + f(MAXE) + ', the largest list. ' +
      '<b>Total</b> = sums over the rows shown; verified counts the verified rows and created gives the range of years.'
  },
  curators: {
    label: 'Curators', rows: CUR, chains: false, ph: 'Search addresses',
    caption: 'Most active curators in the last 30 days, sortable',
    text: r => r.address,
    toggles: [{ k: 'challengers', label: 'Filed challenges', test: r => r.challenges > 0 }],
    meta: n => 'Top ' + CUR.length + ' of ' + f(F.curators30d) + ' curators active in the last 30 days' + (n !== CUR.length ? ' · ' + n + ' shown' : ''),
    sort: { k: 'subs', dir: -1 },
    cols: [
      { k: 'cur', label: 'Curator', fx: 'address', sort: r => r.address.toLowerCase(),
        cell: r => '<span class="who">' + blockie(r.address, 30) + '<span class="mono">' + esc(r.address) + '</span></span>',
        total: rows => 'Total<span class="sub2">' + rows.length + ' ' + plural(rows.length, 'curator', 'curators') + ' shown</span>' },
      { k: 'subs', label: 'Submissions', fx: 'last 30 days', n: 1, sort: r => r.submissions,
        cell: r => '<span class="cellbar"><span class="num">' + f(r.submissions) + '</span>' + bar(r.submissions, MAXS, 'Submissions ÷ ' + f(MAXS) + ' (most active curator)') + '</span>',
        total: rows => '<span class="num">' + f(sum(rows, 'submissions')) + '</span>' },
      { k: 'chal', label: 'Challenges', fx: 'last 30 days', n: 1, sort: r => r.challenges,
        cell: r => '<span class="num' + (r.challenges ? '' : ' muted') + '">' + f(r.challenges) + '</span>',
        total: rows => '<span class="num">' + f(sum(rows, 'challenges')) + '</span>' },
      { k: 'rate', label: 'Win rate', fx: 'won ÷ challenges', n: 1, sort: r => r.rate, nullsLast: true,
        cell: r => r.rate === null ? '<span class="muted" aria-label="No challenges">—</span>' : '<span class="num">' + pct1(r.rate) + '</span><span class="sub2 num">' + r.won + ' of ' + r.challenges + ' won</span>',
        total: rows => { const c = sum(rows, 'challenges'), w = sum(rows, 'won'); return c ? '<span class="num">' + pct1(w / c) + '</span><span class="sub2 num">' + w + ' of ' + c + ' won</span>' : '<span class="muted">—</span>'; } },
      { k: 'share', label: 'Share', fx: 'submissions ÷ ' + f(SUBALL), n: 1, sort: r => r.subShare,
        cell: r => '<span class="num">' + pct1(r.subShare) + '</span>',
        total: rows => '<span class="num">' + pct1(SUBALL ? sum(rows, 'submissions') / SUBALL : 0) + '</span>' }
    ],
    fn: () => 'Last 30 days to the snapshot (' + SNAPLABEL + '), Ethereum + Gnosis · the top ' + CUR.length + ' of ' + f(F.curators30d) + ' curators active in that window. ' +
      '<b>Win rate</b> = won ÷ challenges, shown only when challenges &gt; 0. <b>Share</b> = submissions ÷ ' + f(SUBALL) + ', the submissions of all ' + CUR.length + ' curators listed. ' +
      'The bar under submissions = submissions ÷ ' + f(MAXS) + ', the most active curator. ' +
      '<b>Total</b> = sums over the rows shown; its win rate = Σ won ÷ Σ challenges.'
  }
};
const ORDER = ['registries', 'curators'];

/* ---------- state ---------- */
const state = { tab: 'registries', chain: 'all', q: '', tg: {}, sort: {} };
ORDER.forEach(k => { state.sort[k] = Object.assign({}, TABS[k].sort); });

/* ---------- tabs ---------- */
const tabsEl = $('#tabs'), panel = $('#panel');
tabsEl.innerHTML = ORDER.map(k => '<button class="tab" role="tab" type="button" id="tab-' + k + '" data-tab="' + k + '" aria-controls="panel" aria-selected="' + (k === state.tab) + '" tabindex="' + (k === state.tab ? 0 : -1) + '">' + TABS[k].label + '<span class="cnt num">' + TABS[k].rows.length + '</span></button>').join('') + '<span class="ind" id="ind" aria-hidden="true"></span>';
const ind = $('#ind');
let indPos = null, indTimer = 0;
function setInd(L, W){ ind.style.left = L + 'px'; ind.style.width = W + 'px'; }
function placeInd(animate){
  const btn = tabsEl.querySelector('[aria-selected="true"]'); if (!btn) return;
  const L = btn.offsetLeft, W = btn.offsetWidth;
  clearTimeout(indTimer);
  if (!animate || RM.matches || !indPos){ ind.style.transition = 'none'; setInd(L, W); void ind.offsetWidth; ind.style.transition = ''; indPos = { L, W }; return; }
  const a = indPos, uL = Math.min(a.L, L), uR = Math.max(a.L + a.W, L + W);
  ind.style.transition = 'left .15s cubic-bezier(.4,0,.7,1), width .15s cubic-bezier(.4,0,.7,1)';
  setInd(uL, uR - uL);
  indTimer = setTimeout(() => { ind.style.transition = 'left .38s cubic-bezier(.25,1.35,.45,1), width .38s cubic-bezier(.25,1.35,.45,1)'; setInd(L, W); }, 140);
  indPos = { L, W };
}
function selectTab(k, focus){
  if (!TABS[k]) return;
  const changed = state.tab !== k;
  if (changed){ state.chain = 'all'; state.tg = {}; state.q = ''; qEl.value = ''; searchEl.classList.remove('has'); }
  state.tab = k;
  tabsEl.querySelectorAll('.tab').forEach(b => { const on = b.dataset.tab === k; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; });
  if (focus) $('#tab-' + k).focus();
  placeInd(changed);
  qEl.placeholder = TABS[k].ph;
  panel.setAttribute('aria-labelledby', 'tab-' + k);
  render(changed);
}
tabsEl.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) selectTab(b.dataset.tab); });
tabsEl.addEventListener('keydown', e => {
  const i = ORDER.indexOf(state.tab);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ e.preventDefault(); selectTab(ORDER[(i + (e.key === 'ArrowRight' ? 1 : ORDER.length - 1)) % ORDER.length], true); }
  if (e.key === 'Home'){ e.preventDefault(); selectTab(ORDER[0], true); }
  if (e.key === 'End'){ e.preventDefault(); selectTab(ORDER[ORDER.length - 1], true); }
});

/* ---------- filtering + render ---------- */
const tscroll = $('#tscroll'), chipsEl = $('#chips'), fnEl = $('#tfn');
const qEl = $('#q'), searchEl = $('#search');
function filtered(T, ignoreChain){
  let rows = T.rows.slice();
  if (T.chains && !ignoreChain && state.chain !== 'all') rows = rows.filter(r => r.chain === state.chain);
  (T.toggles || []).forEach(t => { if (state.tg[t.k]) rows = rows.filter(t.test); });
  const q = state.q.trim().toLowerCase();
  if (q) rows = rows.filter(r => T.text(r).toLowerCase().indexOf(q) > -1);
  return rows;
}
function renderChips(T, shown){
  let h = '';
  if (T.chains){
    const base = filtered(T, true);
    const cnt = c => c === 'all' ? base.length : base.filter(r => r.chain === c).length;
    h += '<span class="clabel">Chain</span>' + ['all', 'Ethereum', 'Gnosis'].map(c => {
      const n = cnt(c), dis = c !== 'all' && n === 0 && state.chain !== c;
      return '<button class="chip" type="button" data-chain="' + c + '" aria-pressed="' + (state.chain === c) + '"' + (dis ? ' aria-disabled="true"' : '') + '>' + (c === 'all' ? 'All' : '<span class="d" style="--c:' + CHAIN_C[c] + '"></span>' + c) + '<span class="c num">' + n + '</span></button>';
    }).join('') + '<span class="sep" aria-hidden="true"></span>';
  }
  h += (T.toggles || []).map(t => '<button class="chip" type="button" data-tg="' + t.k + '" aria-pressed="' + !!state.tg[t.k] + '"><span class="ck">' + IC.check + '</span>' + t.label + '</button>').join('');
  chipsEl.innerHTML = '<div class="crow">' + h + '</div><span class="meta">' + T.meta(shown) + '</span>';
}
function render(anim){
  const T = TABS[state.tab], s = state.sort[state.tab];
  const rows = filtered(T);
  const col = T.cols.find(c => c.k === s.k);
  if (col && col.sort){
    rows.sort((a, b) => {
      const x = col.sort(a), y = col.sort(b);
      if (col.nullsLast && (x === null || y === null)) return x === y ? 0 : x === null ? 1 : -1;
      return (x < y ? -1 : x > y ? 1 : 0) * s.dir;
    });
  }
  renderChips(T, rows.length);
  const head = '<thead><tr>' + T.cols.map(c => {
    const on = s.k === c.k;
    return '<th scope="col"' + (c.n ? ' class="n"' : '') + ' aria-sort="' + (on ? (s.dir > 0 ? 'ascending' : 'descending') : 'none') + '"><button class="th-b' + (on ? ' on' : '') + (on && s.dir > 0 ? ' asc' : '') + '" type="button" data-sort="' + c.k + '"><span class="th-l">' + (c.n ? IC.sort : '') + c.label + (c.n ? '' : IC.sort) + '</span><span class="th-f">' + c.fx + '</span></button></th>';
  }).join('') + '</tr></thead>';
  let body;
  if (!rows.length){
    body = '<tbody><tr><td colspan="' + T.cols.length + '"><div class="empty"><p>Nothing here matches' + (state.q ? ' “' + esc(state.q) + '”' : ' these filters') + '.</p><button class="pill-ghost" type="button" data-reset>Clear filters</button></div></td></tr></tbody>';
  } else {
    body = '<tbody>' + rows.map((r, i) => '<tr data-key="' + r.key + '" style="--i:' + i + '">' + T.cols.map(c => '<td' + (c.n ? ' class="n"' : '') + '>' + c.cell(r) + '</td>').join('') + '</tr>').join('') + '</tbody>' +
      '<tfoot><tr>' + T.cols.map(c => '<td' + (c.n ? ' class="n"' : '') + '>' + c.total(rows) + '</td>').join('') + '</tr></tfoot>';
  }
  tscroll.innerHTML = '<table class="t' + (anim && !RM.matches ? ' anim' : '') + '"><caption>' + T.caption + '</caption>' + head + body + '</table>';
  fnEl.innerHTML = T.fn();
  onTScroll();
  syncFacts();
}
/* a fact reads as pressed while the table shows exactly its filter */
const FACT = {
  open: { chain: 'all', tg: { hasopen: true }, sort: { k: 'open', dir: -1 } },
  verified: { chain: 'all', tg: { verified: true }, sort: { k: 'entries', dir: -1 } },
  gnosis: { chain: 'Gnosis', tg: {}, sort: { k: 'entries', dir: -1 } }
};
function factOn(k){
  const p = FACT[k], on = Object.keys(state.tg).filter(t => state.tg[t]);
  return state.tab === 'registries' && !state.q.trim() && state.chain === p.chain &&
    on.length === Object.keys(p.tg).length && on.every(t => p.tg[t]);
}
function syncFacts(){ ribbon.querySelectorAll('[data-act]').forEach(b => b.setAttribute('aria-pressed', factOn(b.dataset.act))); }

/* ---------- interactions ---------- */
chipsEl.addEventListener('click', e => {
  const c = e.target.closest('[data-chain]'), t = e.target.closest('[data-tg]');
  if (c){ state.chain = c.dataset.chain; render(true); }
  if (t){ state.tg[t.dataset.tg] = !state.tg[t.dataset.tg]; render(true); }
});
tscroll.addEventListener('click', e => {
  const sb = e.target.closest('[data-sort]');
  if (sb){
    const k = sb.dataset.sort, s = state.sort[state.tab];
    if (s.k === k) s.dir *= -1;
    else { s.k = k; const col = TABS[state.tab].cols.find(c => c.k === k); s.dir = typeof col.sort(TABS[state.tab].rows[0]) === 'string' ? 1 : -1; }
    render(false);
    const nb = tscroll.querySelector('[data-sort="' + k + '"]'); if (nb) nb.focus({ preventScroll: true });
    return;
  }
  if (e.target.closest('[data-reset]')) resetFilters();
});
function resetFilters(){ state.chain = 'all'; state.q = ''; state.tg = {}; qEl.value = ''; searchEl.classList.remove('has'); render(true); }
qEl.addEventListener('input', () => { state.q = qEl.value; searchEl.classList.toggle('has', !!qEl.value); render(false); });
qEl.addEventListener('keydown', e => { if (e.key === 'Escape' && qEl.value){ e.stopPropagation(); qEl.value = ''; state.q = ''; searchEl.classList.remove('has'); render(false); } });
$('#clearq').addEventListener('click', e => { e.preventDefault(); qEl.value = ''; state.q = ''; searchEl.classList.remove('has'); render(false); qEl.focus(); });
doc.addEventListener('keydown', e => {
  if (e.key === '/' && !e.metaKey && !e.ctrlKey && !/input|textarea/i.test((doc.activeElement || {}).tagName || '')){ e.preventDefault(); qEl.focus(); }
});
function onTScroll(){ tscroll.classList.toggle('sx', tscroll.scrollLeft > 2); }
tscroll.addEventListener('scroll', onTScroll, { passive: true });

/* ribbon facts: filter the registries table to the rows the fact counts; a second click clears it */
ribbon.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const k = b.dataset.act, p = FACT[k], was = factOn(k);
  if (state.tab !== 'registries') selectTab('registries');
  state.q = ''; qEl.value = ''; searchEl.classList.remove('has');
  if (was){ state.chain = 'all'; state.tg = {}; state.sort.registries = Object.assign({}, TABS.registries.sort); render(true); return; }
  state.chain = p.chain; state.tg = Object.assign({}, p.tg); state.sort.registries = Object.assign({}, p.sort);
  render(true);
  const x = $('.explorer'), y = x.getBoundingClientRect().top + window.scrollY - (parseInt(getComputedStyle(root).getPropertyValue('--nav-h')) || 64) - 8;
  window.scrollTo({ top: y, behavior: RM.matches ? 'auto' : 'smooth' });
  const tr = tscroll.querySelector('tfoot tr');
  if (tr && !RM.matches){ tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash'); }
});

/* ---------- theme ---------- */
const themeBtn = $('#theme');
function applyTheme(t){
  if (t === 'light') root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme');
  themeBtn.innerHTML = t === 'light' ? IC.moon : IC.sun;
  themeBtn.setAttribute('aria-label', t === 'light' ? 'Switch to dark theme' : 'Switch to light theme');
}
let theme = 'dark';
try { theme = localStorage.getItem('cv-explore-theme') === 'light' ? 'light' : 'dark'; } catch (e) {}
applyTheme(theme);
themeBtn.addEventListener('click', () => { theme = theme === 'light' ? 'dark' : 'light'; applyTheme(theme); try { localStorage.setItem('cv-explore-theme', theme); } catch (e) {} });

/* ---------- chrome ---------- */
$('#snap span').textContent = 'Snapshot · ' + SNAPLABEL;
$('#foot-snap').textContent = 'Snapshot ' + SNAPLABEL + ' · ' + S.scope;
const nav = $('#nav');
const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 8);
window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
const redraw = () => sparks.forEach(drawSpark);
let rT = 0;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { redraw(); placeInd(false); }, 80); });
if (window.ResizeObserver){ const ro = new ResizeObserver(redraw); sparks.forEach(el => ro.observe(el)); }

selectTab('registries');
redraw();
placeInd(false);
if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(() => { placeInd(false); redraw(); });
})();
</script>
