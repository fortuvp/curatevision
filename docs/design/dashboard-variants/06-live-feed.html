<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Curate · Live feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Urbanist:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#02040B; --bg:#060912; --surface:#0C111D; --surface-2:#0A0F1C;
  --raised:rgba(255,255,255,.045); --hover:rgba(255,255,255,.028);
  --text:#F4F6FB; --muted:#A1ABC0; --faint:#7A849E;
  --border:rgba(255,255,255,.07); --border-strong:rgba(255,255,255,.16);
  --primary:#3D7BFF; --primary-fill:#2962FF; --primary-hover:#3B70FF;
  --success:#34D399; --warning:#F5B04A; --danger:#FF6B7A;
  --eth:#8B6BFF; --gno:#3D7BFF;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.4,.64,1);
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif; --display:"Urbanist","Geist",ui-sans-serif,sans-serif; --mono:"Geist Mono",ui-monospace,SFMono-Regular,monospace;
  --gap:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{padding:var(--gap);background:var(--stage);color:var(--text);font:400 14px/20px var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
ol,ul{list-style:none}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage ---------- */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(55% 60% at 0% 0%,rgba(27,47,255,.62),transparent 70%),
    radial-gradient(45% 55% at 100% 100%,rgba(10,124,255,.55),transparent 70%),
    radial-gradient(32% 40% at 95% 0%,rgba(61,90,255,.4),transparent 72%),
    var(--stage)}
.aurora::before{content:"";position:absolute;left:-25%;top:36%;width:150%;height:34%;transform:rotate(-17deg);
  background:linear-gradient(90deg,transparent 4%,rgba(10,124,255,.38) 34%,rgba(61,90,255,.3) 62%,transparent 94%);filter:blur(90px)}

/* ---------- frame ---------- */
.frame{position:relative;margin:0;height:calc(100vh - var(--gap)*2);height:calc(100dvh - var(--gap)*2);
  display:grid;grid-template-columns:248px minmax(0,1fr) 384px;
  border-radius:32px;background:var(--bg);border:1px solid rgba(255,255,255,.09);overflow:hidden;
  box-shadow:0 50px 120px -40px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07)}
.frame::before{content:"";position:absolute;left:0;right:0;top:0;height:180px;pointer-events:none;
  background:radial-gradient(50% 100% at 50% 0%,rgba(61,123,255,.12),transparent 70%)}

/* ---------- left rail ---------- */
.rail-l{position:relative;display:flex;flex-direction:column;min-height:0;padding:22px 16px 18px;border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px;font:600 20px/1 var(--display);letter-spacing:-.015em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;display:flex;align-items:center;gap:14px;height:46px;padding:0 12px;border-radius:14px;color:var(--muted);font-weight:500;font-size:15px;transition:background .2s,color .2s}
.nav a:hover{background:var(--raised);color:var(--text)}
.nav a[aria-current=page]{color:var(--text);background:linear-gradient(90deg,rgba(255,255,255,.085),rgba(255,255,255,0));box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.nav a[aria-current=page] svg{color:var(--primary);filter:drop-shadow(0 0 8px rgba(61,123,255,.75))}
.nav .count{margin-left:auto;font:500 12px var(--mono);font-style:normal;color:var(--faint)}
.nav .count.hot{color:var(--warning)}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;background:var(--primary-fill);color:#fff;font-weight:600;font-size:15px;
  box-shadow:0 12px 30px -12px rgba(41,98,255,.95),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .25s var(--ease),background .2s,box-shadow .2s}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 16px 36px -12px rgba(41,98,255,1),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-primary:active{transform:translateY(0) scale(.985)}
.rail-l .btn-primary{margin:18px 4px 0;height:50px}
.rail-l .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.scope{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:14px;border:1px solid var(--border);font:500 12px var(--mono);letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.scope .chains{display:flex}
.scope .chains i{width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.scope .chains i+i{margin-left:-5px}
.connect{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:14px;background:var(--raised);border:1px solid var(--border);font-weight:500;transition:border-color .2s}
.connect:hover{border-color:var(--border-strong)}

/* ---------- main column ---------- */
.main{position:relative;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.mhead{position:sticky;top:0;z-index:8;padding:18px 28px 0;background:rgba(6,9,18,.82);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border-bottom:1px solid var(--border)}
.mhead-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:40px}
.mlogo{display:none}
.mhead h1{font:500 27px/1.1 var(--display);letter-spacing:-.03em}
.stamp{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 11px 0 10px;border-radius:999px;background:var(--raised);border:1px solid var(--border);font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.mhead .sp{flex:1}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:14px;color:var(--faint);pointer-events:none}
.search input{width:100%;height:40px;padding:0 42px 0 40px;border-radius:999px;background:var(--raised);border:1px solid var(--border);color:var(--text);font:400 14px var(--sans);outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:rgba(61,123,255,.6);background:rgba(61,123,255,.06);box-shadow:0 0 0 4px rgba(61,123,255,.12)}
.search kbd{position:absolute;right:10px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid var(--border);font:500 11px var(--mono);color:var(--faint)}
.hsearch{width:264px}
.sbtn,.mconnect{display:none;width:38px;height:38px;border-radius:12px;place-items:center;border:1px solid var(--border);color:var(--muted);transition:color .2s,border-color .2s}
.sbtn:hover,.mconnect:hover,.sbtn[aria-expanded=true]{color:var(--text);border-color:var(--border-strong)}
.hbtn{display:none;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--border-strong);font-weight:500;font-size:13px}
.hbtn:hover{background:var(--raised)}
.tabs{position:relative;display:flex;gap:2px;margin:10px -4px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:10px 14px 14px;color:var(--faint);font-weight:500;font-size:14.5px;white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text)}
.tab em{margin-left:7px;font:500 12px var(--mono);font-style:normal;color:var(--faint)}
.tab[aria-selected=true] em{color:var(--muted)}
.tab em.hot{color:var(--warning)}
.tab-ind{position:absolute;bottom:0;left:0;width:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary);box-shadow:0 0 14px rgba(61,123,255,.95),0 0 3px rgba(61,123,255,1);transition:left .5s var(--spring),width .5s var(--spring)}

.feedwrap{padding:16px 28px 56px}
.wkslot{margin-bottom:12px}
.wkslot:empty{display:none}
.composer{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:4px;padding:7px 7px 7px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--border);color:var(--faint);font-size:14.5px;transition:border-color .25s,background .25s}
.composer:hover{border-color:rgba(61,123,255,.45);background:linear-gradient(90deg,rgba(61,123,255,.06),transparent 60%),var(--surface)}
.composer .gav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px dashed rgba(255,255,255,.2);color:var(--muted)}
.composer .ph{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-sm{display:inline-flex;align-items:center;height:32px;padding:0 15px;border-radius:999px;background:var(--primary-fill);color:#fff;font-weight:600;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.filterbar:empty{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 12px;border-radius:999px;background:rgba(61,123,255,.12);border:1px solid rgba(61,123,255,.35);color:#B9CEFF;font-size:12.5px}
.fchip b{color:var(--text);font-weight:500;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#B9CEFF}
.fchip button:hover{background:rgba(255,255,255,.1);color:#fff}

/* ---------- feed head ---------- */
.fhead{display:flex;align-items:center;gap:12px;margin:16px 2px 0}
.fhead .ft{flex:1;min-width:0}
.fhead h2{font:550 15px/21px var(--sans);letter-spacing:-.005em}
.fhead p{font-size:12.5px;line-height:18px;color:var(--faint)}
.fhead .mstamp{display:none;font:500 11px/16px var(--mono);margin-top:2px}
.replay{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 11px;border-radius:999px;border:1px solid var(--border-strong);color:var(--muted);font-weight:500;font-size:12.5px;transition:color .2s,background .2s,border-color .2s}
.replay:hover{color:var(--text);background:var(--raised)}
.replay[aria-pressed=true]{color:#CFE0FF;border-color:rgba(61,123,255,.5);background:rgba(61,123,255,.1)}
.replay svg{width:13px;height:13px}
.rbar{height:2px;margin:10px 2px 0;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:var(--primary);box-shadow:0 0 10px var(--primary);transition:width .4s var(--ease)}

/* ---------- feed ---------- */
.feed.swap{animation:swap .34s var(--ease) both}
@keyframes swap{from{opacity:.35;transform:translateY(5px)}}
.bucket{margin:20px 4px 8px;font:500 11px/16px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.sec{border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.022),rgba(255,255,255,0) 120px),var(--surface);border:1px solid var(--border);box-shadow:inset 0 1px 0 rgba(255,255,255,.045);overflow:hidden}
.ev{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:14px;padding:12px 16px 11px 14px;transition:background .2s}
.ev+.ev{border-top:1px solid var(--border)}
.ev.single{cursor:pointer}
.ev.single:hover,.ev.single:focus-visible{background:var(--hover)}
.ev:focus-visible{outline-offset:-2px;border-radius:0}
.ev-head{display:flex;align-items:flex-start;gap:12px}
.ev-sent{flex:1;min-width:0;color:var(--muted);font-size:14px;line-height:21px;text-wrap:pretty}
.ev-sent b{color:var(--text);font-weight:600}
.ev-time{flex:none;font:500 12px/21px var(--mono);color:var(--faint);cursor:default}
.who{display:inline-flex;align-items:center;gap:6px;vertical-align:-3px}
.who b.mono{font:550 13px/1 var(--mono);color:var(--text)}
.reg{color:var(--text);font-weight:600;text-align:left;border-radius:6px;transition:color .2s}
.reg:hover{color:#9DBBFF;text-decoration:underline;text-decoration-color:rgba(61,123,255,.5);text-underline-offset:3px}
.ev-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:28px;margin-top:2px;font-size:12.5px;color:var(--faint)}
.ev-meta .sp{flex:1;min-width:4px}
.sep{color:rgba(255,255,255,.22)}
.st{display:inline-flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--tone);box-shadow:0 0 0 3px color-mix(in srgb,var(--tone) 22%,transparent)}
.t-open{--tone:#3D7BFF}.t-court{--tone:#F5B04A}.t-ok{--tone:#34D399}.t-off{--tone:#FF6B7A}
.cn{min-width:0;font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cn.mono{font:500 11.5px var(--mono)}
.addr{min-width:0;overflow:hidden;text-overflow:ellipsis;font:500 12.5px var(--mono);color:var(--text);white-space:nowrap}
.disp{font:500 12.5px var(--mono);color:var(--text);white-space:nowrap}
.cell .addr{flex:none}
.also{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--faint)}
.ev-rows{margin-top:4px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:10px;min-height:34px;padding:2px 0;border-top:1px solid var(--border);cursor:pointer;transition:background .2s}
.row.sub{grid-template-columns:88px minmax(0,1fr) auto auto}
.row:hover{background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,0) 85%)}
.row:focus-visible{outline-offset:-2px;border-radius:8px}
.cell{display:flex;align-items:center;gap:8px;min-width:0}
.r-time{font:500 11.5px var(--mono);color:var(--faint);white-space:nowrap;cursor:default}
.ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--faint);flex:none;transition:color .2s,background .2s}
.ic:hover{color:var(--text);background:var(--raised)}
.ic.lg{width:36px;height:36px;border-radius:12px;border:1px solid var(--border)}
.act{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;border:1px solid rgba(61,123,255,.42);background:rgba(41,98,255,.1);color:#A9C4FF;font-weight:550;font-size:12.5px;white-space:nowrap;
  opacity:0;transition:opacity .18s,background .2s,color .2s,border-color .2s,box-shadow .2s}
.act:hover{background:var(--primary-fill);border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(41,98,255,.9)}
.act.ghost{border-color:var(--border-strong);background:transparent;color:var(--text)}
.act.ghost:hover{background:var(--raised);box-shadow:none}
.act.on{border-color:rgba(245,176,74,.4);background:rgba(245,176,74,.1);color:#FFD596}
.act svg{width:13px;height:13px}
.row:hover .act,.row:focus-within .act,.row:focus .act,.ev.single:hover .act,.ev.single:focus-within .act,.ev.single:focus .act,.act.on,.act:focus-visible{opacity:1}
@media (hover:none){.act{opacity:1}}
.oc{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px 0 8px;border-radius:999px;font-weight:600;font-size:12px;color:var(--tone);background:color-mix(in srgb,var(--tone) 11%,transparent);border:1px solid color-mix(in srgb,var(--tone) 26%,transparent);white-space:nowrap}
.oc .dot{width:6px;height:6px;box-shadow:none}
.more{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:4px 0;color:#8FB1FF;font-weight:500;font-size:12.5px;border-radius:6px}
.more:hover{color:#C3D5FF}
.more svg{transition:transform .3s var(--ease)}
.more[aria-expanded=true] svg{transform:rotate(180deg)}
.idc{display:inline-block;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.16)}
.idc svg{width:100%;height:100%}
.feedend{margin:22px 0 0;text-align:center;font-size:12.5px;color:var(--faint)}
.feedfn{max-width:640px;margin:18px auto 0;padding-top:12px;border-top:1px solid var(--border);text-align:left}
.feedend a{color:#8FB1FF}
.feedend a:hover{color:#C3D5FF}
.empty{margin-top:20px;padding:40px 20px;text-align:center;border-radius:20px;border:1px solid var(--border);background:var(--surface)}
.empty .e1{font:500 20px/1.2 var(--display);letter-spacing:-.02em}
.empty .e2{margin-top:6px;color:var(--faint)}
.empty .btn-sec{margin-top:18px}
.ev.fresh{animation:fresh 1.9s var(--ease-out) both}
.row.fresh{animation:rowfresh 1.9s var(--ease-out) both}
@keyframes fresh{0%{opacity:.4;transform:translateY(-6px);background:rgba(61,123,255,.18);box-shadow:inset 3px 0 0 var(--primary)}
  25%{opacity:1;transform:none;background:rgba(61,123,255,.13);box-shadow:inset 3px 0 0 var(--primary)}
  100%{background:rgba(61,123,255,0);box-shadow:inset 3px 0 0 rgba(61,123,255,0)}}
@keyframes rowfresh{0%{opacity:.4;background:rgba(61,123,255,.22)}25%{opacity:1;background:rgba(61,123,255,.14)}100%{background:rgba(61,123,255,0)}}
.row.reveal{animation:reveal .4s var(--ease-out) both}
@keyframes reveal{from{opacity:.3;transform:translateY(-4px)}}

/* registry avatar: rounded square, people are circles */
.av{position:relative;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 28% 18%,hsl(var(--h) 62% 56% / .42),transparent 64%),hsl(var(--h) 26% 14%);
  box-shadow:inset 0 0 0 1px hsl(var(--h) 60% 70% / .16),inset 0 1px 0 rgba(255,255,255,.12);font:650 12px/1 var(--display);letter-spacing:.02em;color:hsl(var(--h) 70% 88%)}
.av .badge{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--tone);border:2.5px solid var(--surface);box-shadow:0 0 10px -1px var(--tone)}
.av .badge svg{width:10px;height:10px;stroke:#060912}

/* ---------- right rail ---------- */
.rail-r{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:20px 20px 28px;border-left:1px solid var(--border);display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.rail-head{display:none}
.panel{position:relative;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.045)}
.p-head{display:flex;align-items:flex-start;gap:10px}
.p-head>div{flex:1;min-width:0}
.p-title{font-size:15px;font-weight:600;letter-spacing:-.005em}
.p-cap{margin-top:2px;font-size:12px;line-height:17px;color:var(--faint)}
.lbl{font:500 11px/16px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.featured{background:radial-gradient(90% 70% at 15% 0%,rgba(61,123,255,.16),transparent 70%),var(--surface);border-color:transparent}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
.featured::before,.featured::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.featured::before{background:linear-gradient(140deg,rgba(110,160,255,.95),rgba(61,123,255,.45) 30%,rgba(255,255,255,.06) 55%,rgba(255,255,255,.16) 80%,rgba(10,124,255,.85))}
.featured::after{padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 78%,rgba(207,224,255,0) 80%,#E4EDFF 88%,transparent 91%);opacity:0}
.anim .featured::after{animation:comet 2.6s .7s var(--ease) both}
@keyframes comet{0%{--ang:0deg;opacity:1}88%{opacity:1}100%{--ang:360deg;opacity:0}}
.big{margin-top:8px;font:500 46px/1 var(--display);letter-spacing:-.04em}
.rlist{margin-top:8px}
.rrow{width:calc(100% + 16px);display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:10px 8px;margin:0 -8px;border-radius:14px;transition:background .18s var(--ease),transform .18s var(--ease)}
.rrow:hover{background:var(--hover);transform:translateY(-1px)}
.rrow[aria-pressed=true]{background:rgba(61,123,255,.1);box-shadow:inset 0 0 0 1px rgba(61,123,255,.3)}
.rrow .av,.rrow .idc{grid-row:1 / 3}
.rrow .av{width:32px;height:32px;border-radius:10px;font-size:10.5px}
.rrow .nm{font-weight:550;font-size:13.5px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm.mono{font:500 13px/18px var(--mono)}
.rrow .sub{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden}
.rrow .n{grid-row:1;grid-column:3;text-align:right;font:500 18px/18px var(--display);letter-spacing:-.01em}
.rrow .pc{grid-row:2;grid-column:3;text-align:right;font-size:11.5px;color:var(--faint)}
.kc{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--mono);color:var(--muted)}
.kc .dot{width:6px;height:6px;box-shadow:none}
.kbar{grid-column:2 / 4;height:4px;margin-top:5px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.kfill{display:flex;gap:2px;height:100%}
.kfill i{display:block;height:100%;min-width:3px;border-radius:2px;background:var(--tone);box-shadow:0 0 8px -1px var(--tone)}
.klegend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11.5px;line-height:16px;color:var(--muted)}
.klegend span{display:inline-flex;align-items:center;gap:6px}
.klegend .dot{width:6px;height:6px;box-shadow:none}

/* weekday rhythm: seven bars Mon..Sun, each the mean of series30d requests per occurrence of that UTC weekday */
.wkhead{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-top:12px}
.wkhead .big{margin-top:0;font-size:40px}
.wsub{font-size:12.5px;line-height:18px;color:var(--muted)}
.wsub b{color:var(--text);font:500 12.5px var(--mono)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.wkc{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:6px 0 5px;border-radius:12px;transition:background .18s var(--ease)}
.wkc:hover,.wkc[aria-pressed=true]{background:rgba(255,255,255,.04)}
.wkc[aria-pressed=true]{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.wkc .v{font:500 12px/16px var(--mono);color:var(--muted)}
.wkc[aria-pressed=true] .v,.wkc.top .v{color:var(--text)}
.wkb{width:58%;max-width:44px;height:var(--wkh,112px);display:flex;flex-direction:column;justify-content:flex-end;border-bottom:1px solid rgba(255,255,255,.16)}
.wkb i{display:block;width:100%;transform-origin:50% 100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#9CBCFF,#3D7BFF 45%,rgba(27,47,255,.6));box-shadow:0 0 10px -1px rgba(61,123,255,.7)}
.wkb i.part{background:repeating-linear-gradient(135deg,rgba(156,188,255,.95) 0 1.5px,rgba(61,123,255,.2) 1.5px 3.5px);box-shadow:inset 0 0 0 1px rgba(156,188,255,.6)}
.wkb i.part+i{border-radius:0}
.wkc.top .wkb i:not(.part){background:linear-gradient(180deg,#DCE8FF,#5A8FFF 40%,#2440FF);box-shadow:0 0 18px -1px rgba(61,123,255,1)}
.wkc .d{font-size:12.5px;line-height:16px;font-weight:550;color:var(--muted)}
.wkc[aria-pressed=true] .d,.wkc.top .d{color:var(--text)}
.wkc .k{font-size:10.5px;line-height:14px;color:var(--faint);white-space:nowrap}
.wkread{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px;min-height:24px;font-size:12px;color:var(--muted)}
.wkread .h{font-weight:550;color:var(--text);margin-right:2px}
.wkread span.c{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;background:var(--raised);font:500 11.5px var(--mono);color:var(--muted)}
.wkread span.c.part{background:repeating-linear-gradient(135deg,rgba(156,188,255,.12) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px rgba(156,188,255,.3)}
.wkread b{color:var(--text);font-weight:500}
.wkread .eq{font:500 12px var(--mono);color:var(--muted)}
.wkread .eq b{font-weight:600}
.fn{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;line-height:17px;color:var(--faint);text-wrap:pretty}
.fn b{color:var(--muted);font-weight:550}
.anim .wkb i{animation:grow .9s var(--ease-out) both;animation-delay:calc(var(--i)*70ms + 120ms)}
@keyframes grow{from{transform:scaleY(.06);opacity:.5}}
.linkbtn{margin-top:6px;color:#8FB1FF;font-weight:500;font-size:13px}
.linkbtn:hover{color:#C3D5FF}
.rfoot{padding:4px 4px 0;font-size:11.5px;line-height:18px;color:var(--faint)}
.rfoot .stampline{font:500 11px var(--mono);margin-bottom:4px;color:var(--muted)}
.rfoot a:hover{color:var(--text)}

/* ---------- load motion: only when the page is visible; never hides content ---------- */
.anim .ev{animation:rise .6s var(--ease-out) both;animation-delay:calc(var(--i)*45ms + 60ms)}
@keyframes rise{from{opacity:.55;transform:translateY(8px)}}
.anim .wipe{animation:wipe 1s .15s var(--ease-out) both}
@keyframes wipe{from{opacity:.45;filter:saturate(.5)}}
.bars{position:relative;overflow:hidden}
.anim .bars::after{content:"";position:absolute;top:0;bottom:0;left:0;width:22%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(190,212,255,.16),transparent);animation:sheen 1.4s .3s var(--ease) both}
@keyframes sheen{from{transform:translateX(-100%);opacity:1}to{transform:translateX(460%);opacity:0}}

/* ---------- layers ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(2,4,11,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;top:var(--gap);right:var(--gap);bottom:var(--gap);width:min(452px,calc(100vw - var(--gap)*2));overflow-y:auto;overscroll-behavior:contain;padding:22px 24px 24px;
  background:linear-gradient(180deg,#0F1526,#0A0F1C 40%);border:1px solid rgba(255,255,255,.1);border-radius:28px;box-shadow:0 40px 90px -20px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07);
  transform:translateX(calc(100% + 40px));visibility:hidden;transition:transform .55s var(--ease-out),visibility 0s .55s}
.sheet.open{transform:none;visibility:visible;transition:transform .55s var(--ease-out),visibility 0s}
.grab{display:none;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:-8px auto 16px}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head>.sh-t{flex:1;min-width:0}
.sh-head .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head h2{margin-top:2px;font:500 22px/1.15 var(--display);letter-spacing:-.025em}
.sh-sent{margin-top:16px;color:var(--muted);font-size:14.5px;line-height:22px}
.kv{margin-top:18px;border-top:1px solid var(--border)}
.kv>div{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--border);align-items:start}
.kv dt{color:var(--faint);font-size:13px;line-height:20px}
.kv dd{font-size:13.5px;line-height:20px;min-width:0;overflow-wrap:anywhere}
.kv dd .idc{vertical-align:-4px;margin-right:8px}
.kv dd .f{color:var(--faint)}
.ids li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;align-items:start}
.ids li+li{margin-top:10px}
.ids .cn{display:block;grid-column:1;font-size:12px;line-height:18px}
.ids code{grid-column:1;font:500 12px/1.55 var(--mono);color:var(--text);word-break:break-all}
.ids .ic{grid-column:2;grid-row:1 / 3}
.sh-sub{margin-top:24px;font:500 11px/16px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.steps{margin-top:12px}
.steps>li{position:relative;padding:0 0 18px 36px}
.steps>li::before{content:"";position:absolute;left:11px;top:26px;bottom:3px;width:1.5px;background:var(--border-strong)}
.steps>li:last-child{padding-bottom:0}
.steps>li:last-child::before{display:none}
.mk{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--border-strong);background:var(--surface-2);color:var(--faint)}
.mk svg{width:12px;height:12px}
.done .mk{background:rgba(255,255,255,.08);border-color:transparent;color:var(--muted)}
.done.tone .mk{background:color-mix(in srgb,var(--tone) 18%,transparent);color:var(--tone)}
.now .mk{border-color:var(--tone);box-shadow:0 0 0 4px color-mix(in srgb,var(--tone) 18%,transparent)}
.now .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--tone);box-shadow:0 0 10px var(--tone)}
.steps b{display:block;padding-top:2px;font-weight:600;font-size:14px}
.steps p{margin-top:2px;color:var(--muted);font-size:13px;line-height:19px}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.fork div{padding:10px 12px;border-radius:14px;background:var(--raised);border:1px solid var(--border)}
.fork b{font-size:13px;padding:0}
.fork p{font-size:12.5px;line-height:18px}
.sh-actions{display:flex;gap:10px;margin-top:24px}
.sh-actions .btn-primary{flex:1}
.btn-sec{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--border-strong);font-weight:500;transition:background .2s}
.btn-sec:hover{background:var(--raised)}
.picks{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:1px solid var(--border);background:var(--surface);transition:border-color .2s,background .2s}
.pick:hover{border-color:var(--border-strong)}
.pick[aria-checked=true]{border-color:rgba(61,123,255,.6);background:linear-gradient(90deg,rgba(61,123,255,.1),transparent 70%),var(--surface)}
.pick .av{width:34px;height:34px;border-radius:10px;font-size:11px}
.pick span{flex:1;min-width:0}
.pick b{display:block;font-weight:550;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick small{display:block;font-size:12px;color:var(--faint)}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);flex:none;display:grid;place-items:center}
.pick[aria-checked=true] .radio{border-color:var(--primary)}
.pick[aria-checked=true] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px var(--primary)}
.toast{position:fixed;left:50%;bottom:30px;z-index:80;transform:translate(-50%,16px);opacity:0;padding:10px 16px;border-radius:999px;background:#F4F6FB;color:#060912;font-weight:500;font-size:13.5px;white-space:nowrap;box-shadow:0 16px 40px -12px rgba(0,0,0,.7);transition:opacity .3s,transform .45s var(--ease-out);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- mobile bottom nav ---------- */
.bnav{display:none;position:fixed;z-index:40;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));padding:0 6px env(safe-area-inset-bottom);
  background:rgba(6,9,18,.88);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border-top:1px solid var(--border);justify-content:space-around;align-items:center}
.bnav>a,.bnav>button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;font-size:10.5px;font-weight:500;color:var(--faint)}
.bnav [aria-current=page]{color:var(--text)}
.bnav [aria-current=page] svg{color:var(--primary);filter:drop-shadow(0 0 8px rgba(61,123,255,.7))}
.bnav .fab{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--primary-fill);color:#fff;box-shadow:0 10px 26px -8px rgba(41,98,255,1),inset 0 1px 0 rgba(255,255,255,.28)}
.bnav .bdg{position:absolute;top:-4px;left:50%;margin-left:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--warning);color:#1A1203;font:600 10px/16px var(--mono);text-align:center}

/* ---------- responsive ---------- */
@media (max-width:1339px){ .frame{grid-template-columns:228px minmax(0,1fr) 352px} .hsearch{width:220px} }
@media (max-width:1179px){
  .frame{grid-template-columns:84px minmax(0,1fr)}
  .wkslot .wkpanel{margin:0}
  .rail-l{padding:20px 0 18px;align-items:center}
  .brand{padding:4px 0 24px}
  .brand span,.nav span,.nav .count,.rail-l .btn-primary span,.scope,.connect span{display:none}
  .nav a{width:52px;justify-content:center;padding:0}
  .nav a:has(.hot)::after{content:"";position:absolute;top:11px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--warning);box-shadow:0 0 0 2px var(--bg)}
  .rail-l .btn-primary{width:52px;height:52px;padding:0;margin:16px 0 0}
  .connect{width:52px;justify-content:center;padding:0}
  .hbtn{display:inline-flex}
  .sbtn{display:grid}
  .hsearch{display:none;order:10;flex-basis:100%;width:auto;margin-top:2px}
  .mhead.sopen .hsearch{display:flex}
  .hsearch kbd{display:none}
  .rail-head p{margin-top:2px;font-size:12px;color:var(--faint)}
  .rail-r{position:fixed;z-index:55;top:var(--gap);right:var(--gap);bottom:var(--gap);width:min(400px,calc(100vw - var(--gap)*2));border:1px solid rgba(255,255,255,.1);border-radius:28px;background:linear-gradient(180deg,#0F1526,#0A0F1C 40%);
    box-shadow:0 40px 90px -20px rgba(0,0,0,.85);transform:translateX(calc(100% + 40px));visibility:hidden;transition:transform .55s var(--ease-out),visibility 0s .55s}
  .rail-r.open{transform:none;visibility:visible;transition:transform .55s var(--ease-out),visibility 0s}
  .rail-head{display:flex;align-items:center;justify-content:space-between}
  .rail-head h2{font:500 22px/1.1 var(--display);letter-spacing:-.025em}
}
@media (max-width:759px){
  :root{--gap:0px}
  .frame{margin:0;height:100vh;height:100dvh;border-radius:0;border:0;grid-template-columns:minmax(0,1fr);box-shadow:none}
  .rail-l{display:none}
  .main{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .mhead{padding:10px 16px 0}
  .mhead-top{gap:10px}
  .mlogo{display:block}
  .mhead h1{font-size:23px}
  .stampwrap,.hbtn{display:none}
  .mconnect{display:grid}
  .tabs{margin-top:6px}
  .tab{padding:10px 10px 12px;font-size:14px}
  .tab em{margin-left:5px;font-size:11.5px}
  .feedwrap{padding:12px 12px 24px}
  .wkslot{margin-bottom:8px}
  .wkslot .wkpanel{padding:14px 14px 12px;border-radius:18px}
  .wkslot .wkb{--wkh:52px}
  .wkslot .wkhead,.wkslot .wkc .k,.wkslot .wkread,.wkslot .fn-dc{display:none}
  .wkslot .wk{margin-top:8px;gap:2px}
  .wkslot .wkc{padding:3px 0 2px;gap:3px}
  .wkslot .wkc .v{font-size:11.5px;line-height:14px}
  .wkslot .wkc .d{font-size:12px;line-height:14px}
  .wkslot .fn{margin-top:8px;padding-top:8px;font-size:11px;line-height:15px}
  .composer{display:none!important}
  .fhead{margin-top:14px}
  .fhead .fsub{display:none}
  .fhead .mstamp{display:block}
  .bucket{margin:16px 4px 8px}
  .sec{border-radius:18px}
  .ev{grid-template-columns:32px minmax(0,1fr);column-gap:12px;padding:12px 12px 10px}
  .av{width:32px;height:32px;border-radius:10px;font-size:11px}
  .av .badge{width:17px;height:17px}
  .ev-sent{font-size:14px;line-height:21px}
  .row.sub{grid-template-columns:74px minmax(0,1fr) auto auto;column-gap:8px}
  .cn.mono{font-size:10.5px}
  .row.sub .also,.also .lg{display:none}
  .ev .ic[data-copy]{display:none}
  .act{height:28px;padding:0 11px;font-size:12px}
  .rail-r{top:auto;left:0;right:0;bottom:0;width:auto;max-height:88dvh;border-radius:26px 26px 0 0;border-bottom:0;transform:translateY(105%);padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  .rail-r::before{content:"";display:block;flex:none;width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:-8px auto 2px}
  .sheet{top:auto;left:0;right:0;bottom:0;width:auto;max-height:90dvh;border-radius:26px 26px 0 0;border-bottom:0;transform:translateY(105%);padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  .grab{display:block}
  .kv>div{grid-template-columns:96px minmax(0,1fr)}
  .fork{grid-template-columns:1fr}
  .bnav{display:flex}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .featured::after{display:none}
}

<body>
<div class="aurora" aria-hidden="true"></div>

<div class="frame">
  <!-- left rail -->
  <aside class="rail-l" aria-label="Navigation">
    <a class="brand" href="#" aria-label="Curate home"><i data-i="logo"></i><span>Curate</span></a>
    <nav class="nav" aria-label="Primary">
      <a href="#" aria-current="page"><i data-i="activity"></i><span>Activity</span></a>
      <a href="#"><i data-i="lists"></i><span>Registries</span></a>
      <a href="#"><i data-i="scale"></i><span>Court</span><em class="count hot" id="navCourt"></em></a>
      <a href="#"><i data-i="users"></i><span>Curators</span></a>
      <a href="#"><i data-i="launch"></i><span>Launch a list</span></a>
      <a href="#"><i data-i="book"></i><span>Guide</span></a>
    </nav>
    <button class="btn-primary" data-submit aria-label="Submit an entry"><i data-i="plus"></i><span>Submit an entry</span></button>
    <div class="foot">
      <div class="scope" title="Scope: Ethereum and Gnosis mainnets"><span class="chains"><i style="background:var(--eth)"></i><i style="background:var(--gno)"></i></span>ETH + GNO</div>
      <button class="connect" data-toast="Wallet connection is not wired in this prototype" aria-label="Connect wallet"><i data-i="wallet"></i><span>Connect wallet</span></button>
    </div>
  </aside>

  <!-- feed column -->
  <main class="main" id="main">
    <header class="mhead" id="mhead">
      <div class="mhead-top">
        <i class="mlogo" data-i="logo"></i>
        <h1>Activity</h1>
        <div class="stampwrap"><span class="stamp" title="Every figure and event on this page comes from this snapshot"><i class="sdot"></i><span id="stamp"></span></span></div>
        <span class="sp"></span>
        <label class="search hsearch"><span class="sr">Search the feed</span><i data-i="search"></i><input type="search" id="q" placeholder="Search registry or address" autocomplete="off"><kbd>/</kbd></label>
        <button class="sbtn" id="sbtn" aria-label="Search" aria-expanded="false"><i data-i="search"></i></button>
        <button class="hbtn" data-rail><i data-i="users"></i>Most active</button>
        <button class="mconnect" data-toast="Wallet connection is not wired in this prototype" aria-label="Connect wallet"><i data-i="wallet"></i></button>
      </div>
      <div class="tabs" role="tablist" aria-label="Event type">
        <button class="tab" role="tab" aria-selected="true" data-tab="all"><span>All<em id="cAll"></em></span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="submission"><span>Submissions<em id="cSub"></em></span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="challenge"><span>In court<em class="hot" id="cCourt"></em></span></button>
        <button class="tab" role="tab" aria-selected="false" data-tab="resolution"><span>Rulings<em id="cRul"></em></span></button>
        <i class="tab-ind" aria-hidden="true"></i>
      </div>
    </header>

    <div class="feedwrap">
      <div class="wkslot" id="wkSlot"></div>
      <button class="composer" id="composer" data-submit><span class="gav"><i data-i="plus"></i></span><span class="ph">Add an entry to a list</span><span class="btn-sm">Submit</span></button>
      <div class="filterbar" id="filterbar"></div>
      <div class="fhead">
        <div class="ft"><h2 id="fTitle"></h2><p class="fsub" id="fSub"></p><p class="mstamp" id="mstamp"></p></div>
        <button class="replay" id="replay" aria-pressed="false" title="Replay the events of the 24 hours before the snapshot, oldest first"></button>
      </div>
      <div class="rbar" id="rbar" hidden><i></i></div>
      <div class="feed" id="feed"></div>
    </div>
  </main>

  <!-- right rail -->
  <aside class="rail-r" id="rail" aria-label="Weekday rhythm and most active">

$$("[data-i]").forEach(function(el){var k=el.getAttribute("data-i");if(!I[k])return;if(el.className)el.innerHTML=I[k];else el.outerHTML=I[k]});

/* ---------- feed ---------- */
function hay(e){var x=[e.registry,e.actor,e.status,e.chain,e.outcome||"",e.kind==="submission"?"submission submitted request":e.kind==="challenge"?"challenge challenged court dispute":"ruling jurors resolution"];if(e.id){var c=parseId(e.id);x.push(e.id,c.name,c.full)}return x.join(" ").toLowerCase()}

}
function groupify(list){

var FULLWD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var TONES=[["open","Open to challenge"],["court","In court"],["ok","Registered by ruling"],["off","Rejected or removed by ruling"]];

// timeline footnote: formula + window, from the same arrays the feed merges
var FEEDFN='<p class="fn feedfn"><b>Timeline</b> = openToChallenge ('+N.submission+') + inCourt ('+N.challenge+') + decided ('+N.resolution+') = '+N.all+' events, sorted by event time, newest first. '+
  'Age = snapshot time ('+fmtUTC(SNAP)+') − event time, in whole minutes, hours or days. '+
  'One card groups consecutive events by the same address in the same registry at most 3 hours apart; one row groups the same address submitted on several chains. '+
  'Window: '+WIN+' (oldest to newest event), '+SCOPE+'; '+CHNOTE+'.</p>';

// count events per key across the merged timeline; ties go to the most recent event
function tally(keyOf){
  var m={},out=[];
  ALL.forEach(function(e){var k=keyOf(e),r=m[k];
    if(!r){r=m[k]={key:k,e:e,n:0,last:0,tone:{open:0,court:0,ok:0,off:0}};out.push(r)}
    r.n++;r.tone[toneOf(e)]++;if(e.at>r.last)r.last=e.at});
  return out.sort(function(a,b){return b.n-a.n||b.last-a.last});
}

function legend(){return TONES.map(function(t){return '<span><i class="dot t-'+t[0]+'"></i>'+t[1]+'</span>'}).join("")}
function kcounts(r){return TONES.filter(function(t){return r.tone[t[0]]}).map(function(t){return '<span class="kc t-'+t[0]+'" title="'+r.tone[t[0]]+' · '+t[1]+'"><i class="dot"></i>'+r.tone[t[0]]+'</span>'}).join("")}

// weekday rhythm: mean series30d requests per occurrence of each UTC weekday, Monday first.
// A 30-day window holds some weekdays 5 times and the rest 4, so a plain sum would favour the
// weekdays that occur more often; the mean (sum / occurrences) puts every weekday on one scale.
var WK=null;
function weekModel(){
  var d=S.series30d||[],n=d.length,last=d[n-1],partial=!!last&&SNAP<last.day+DAY;
  var W=[1,2,3,4,5,6,0].map(function(w){return {w:w,sum:0,days:[],part:0,mean:0}}),by={};
  W.forEach(function(x){by[x.w]=x});
  d.forEach(function(x,i){var o=by[D(x.day).getUTCDay()];o.sum+=x.requests;o.days.push(x);if(partial&&i===n-1)o.part=x.requests});
  W.forEach(function(x){x.mean=x.days.length?x.sum/x.days.length:0});
  var max=Math.max.apply(null,W.map(function(x){return x.mean}));
  var top=W.reduce(function(a,x){return x.mean>a.mean?x:a},W[0]),low=W.reduce(function(a,x){return x.mean<a.mean?x:a},W[0]);
  return {d:d,n:n,last:last,partial:partial,W:W,by:by,max:max,top:top,low:low};
}
function m1(v){return v.toFixed(1)}
function wkRead(w){
  var M=WK,x=M.by[w],lastDay=M.last&&M.last.day;
  return '<span class="h">'+FULLWD[x.w]+'s</span>'+x.days.map(function(y){var p=M.partial&&y.day===lastDay;return '<span class="c'+(p?' part':'')+'"'+(p?' title="Counted to '+hm(SNAP)+' UTC"':'')+'>'+fmtShort(y.day)+' <b>'+y.requests+'</b>'+(p?' · to '+hm(SNAP):'')+'</span>'}).join("")+'<span class="eq">= '+nf(x.sum)+' / '+x.days.length+' = <b>'+m1(x.mean)+'</b> per day</span>';
}
function renderWeek(){
  var M=WK=weekModel(),W=M.W;
  if(!M.n){$("#wk").innerHTML='<p class="wsub" style="margin-top:12px">No daily series in the snapshot.</p>';return}
  if(state.wk==null)state.wk=M.top.w;
  $("#wkCap").textContent="Mean requests per day, by UTC weekday · last "+M.n+" days";
  var cols=W.map(function(x,i){
    // the partial last day's share of the mean (part / occurrences) is drawn hatched on top
    var occ=x.days.length,h=M.max?Math.max(x.mean?2:0,x.mean/M.max*100):0,ph=M.max&&occ?x.part/occ/M.max*100:0,full=Math.max(0,h-ph);
    return '<button class="wkc'+(x===M.top?' top':'')+'" data-w="'+x.w+'" style="--i:'+i+'" aria-pressed="'+(x.w===state.wk)+'" aria-label="'+FULLWD[x.w]+': '+m1(x.mean)+' requests per day on average ('+nf(x.sum)+' over '+occ+' '+FULLWD[x.w]+'s)">'+
      '<span class="v num">'+m1(x.mean)+'</span><span class="wkb">'+(ph?'<i class="part" style="height:'+ph.toFixed(2)+'%"></i>':'')+'<i style="height:'+full.toFixed(2)+'%"></i></span>'+
      '<span class="d">'+WD[x.w]+'</span><span class="k">÷ '+occ+'</span></button>'}).join("");
  $("#wk").innerHTML='<div class="wkhead"><span class="big">'+FULLWD[M.top.w]+'</span><span class="wsub">busiest · <b>'+m1(M.top.mean)+'</b> requests per '+FULLWD[M.top.w]+'<br>quietest '+FULLWD[M.low.w]+' · <b>'+m1(M.low.mean)+'</b> per day</span></div>'+
    '<div class="wk" role="group" aria-label="Mean requests per day by UTC weekday, last '+M.n+' days">'+cols+'</div>'+
    '<p class="wkread" id="wkRead" aria-live="polite">'+wkRead(state.wk)+'</p>';
  // how often each weekday occurs in the window
  var byLen={};W.forEach(function(x){(byLen[x.days.length]=byLen[x.days.length]||[]).push(FULLWD[x.w])});
  var lens=Object.keys(byLen).map(Number).sort(function(a,b){return byLen[a].length-byLen[b].length});
  var occ=lens.length===1?"each weekday occurs "+lens[0]+" times":lens.slice(0,-1).map(function(l){return joinAnd(byLen[l])+" occur"+(byLen[l].length===1?"s ":" ")+l+" times"}).join("; ")+", the other days "+lens[lens.length-1];
  $("#wkFn").innerHTML='<b>Bar</b> = mean daily requests (series30d) on that UTC weekday; <b>mean = sum / occurrences</b><span class="fn-dc">, the divisor under each bar</span>. Window: last '+M.n+' days, '+fmtRange(M.d[0].day,M.last.day)+(M.partial?' ('+fmtShort(M.last.day)+' counted to '+hm(SNAP)+' UTC, its share hatched)':'')+'; '+occ+'. '+SCOPE+'.';
  var wrap=$("#wk");
  function show(w){$$(".wkc",wrap).forEach(function(b){b.setAttribute("aria-pressed",String(+b.getAttribute("data-w")===w))});$("#wkRead").innerHTML=wkRead(w)}
  wrap.addEventListener("pointerover",function(e){var b=e.target.closest(".wkc");if(b)show(+b.getAttribute("data-w"))});
  wrap.addEventListener("pointerleave",function(){show(state.wk)});
  wrap.addEventListener("focusin",function(e){var b=e.target.closest(".wkc");if(b)show(+b.getAttribute("data-w"))});
  wrap.addEventListener("click",function(e){var b=e.target.closest(".wkc");if(!b)return;state.wk=+b.getAttribute("data-w");show(state.wk)});
}
// the weekday strip sits in the rail on wide screens and above the feed when the rail is a sheet
var wkSec=$("#wkSec"),wkMQ=window.matchMedia("(max-width:1179px)");
function placeWeek(){var slot=$("#wkSlot");if(wkMQ.matches){if(wkSec.parentNode!==slot)slot.appendChild(wkSec)}else if(wkSec.parentNode!==rail){rail.insertBefore(wkSec,rail.children[1])}}

function renderRail(){renderWeek();renderActors();renderRegs();placeWeek()}
rail.addEventListener("click",function(ev){
  var b=ev.target.closest(".rrow");
  if(b){
    if(state.replay)stopReplay();
    if(b.hasAttribute("data-actor")){var a=b.getAttribute("data-actor");state.actor=state.actor===a?null:a}
    else{var r=b.getAttribute("data-reg"),c=b.getAttribute("data-chain");var same=state.reg===r&&state.regChain===c;state.reg=same?null:r;state.regChain=same?null:c}
    render(true);$("#main").scrollTo({top:0,behavior:RM?"auto":"smooth"});if(wkMQ.matches)closeLayers();return;
  }
  if(ev.target.closest("#actMore")){state.actAll=!state.actAll;renderActors();renderFilterbar()}
});
if(wkMQ.addEventListener)wkMQ.addEventListener("change",placeWeek);else if(wkMQ.addListener)wkMQ.addListener(placeWeek);
$("#filterbar").addEventListener("click",function(ev){if(ev.target.closest("[data-clearreg]")){state.reg=null;state.regChain=null;render(true)}if(ev.target.closest("[data-clearactor]")){state.actor=null;render(true)}if(ev.target.closest("[data-clearq]")){setQ("");closeSearch();render(true)}});

/* ---------- utilities ---------- */
var tEl=$("#toast"),tT;
function toast(msg){tEl.textContent=msg;tEl.classList.add("show");clearTimeout(tT);tT=setTimeout(function(){tEl.classList.remove("show")},2200)}
function copy(text,msg){
  function fb(){var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(ta);toast(msg)}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){toast(msg)},fb)}else fb();
}

/* ---------- boot: final values render first; motion only when visible ---------- */
if(!RM&&document.visibilityState==="visible"){document.documentElement.classList.add("anim");setTimeout(function(){document.documentElement.classList.remove("anim")},2400)}
renderRail();
render(false);
moveInd();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
window.addEventListener("resize",moveInd);
})();
</script>
</body>
