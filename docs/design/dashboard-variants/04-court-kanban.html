<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curate Court Board</title>
<meta name="description" content="CurateVision home dashboard variant: every case in the pipeline with its age. Open requests and rulings carry age rings and their registry figures; disputes in court are grouped by the burst they arrived in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Urbanist:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#02040a;
  --frame:#0a0b0e;
  --line:rgba(255,255,255,.06);
  --line-2:rgba(255,255,255,.1);
  --line-3:rgba(255,255,255,.16);
  --text:#eef0f4;
  --text-2:#a7adba;
  --text-3:#8a92a0;
  --blue:#4f8cff;
  --blue-rgb:79,140,255;
  --amber:#f5a524;
  --neutral:#c9ced8;
  --r-frame:30px;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Urbanist", "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.36,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:13px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- aurora stage ---------- */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px) saturate(125%)}
.aurora i{position:absolute;border-radius:50%;display:block}
.aurora .a1{width:70%;height:55%;left:15%;bottom:2%;background:radial-gradient(closest-side,#2563eb 0%,rgba(37,99,235,.6) 45%,transparent 100%);animation:drift1 26s ease-in-out infinite alternate}
.aurora .a2{width:48%;height:50%;left:-4%;top:4%;background:radial-gradient(closest-side,rgba(56,189,248,.75),transparent 100%);animation:drift2 32s ease-in-out infinite alternate}
.aurora .a3{width:50%;height:52%;right:-6%;top:18%;background:radial-gradient(closest-side,rgba(99,102,241,.75),transparent 100%);animation:drift3 30s ease-in-out infinite alternate}
.aurora .a4{width:42%;height:30%;left:34%;bottom:-6%;background:radial-gradient(closest-side,rgba(125,211,252,.8),transparent 100%)}
.aurora .a5{width:40%;height:30%;left:30%;top:2%;background:radial-gradient(closest-side,rgba(59,130,246,.55),transparent 100%)}
@keyframes drift1{to{transform:translate(4%,-3%) scale(1.06)}}
@keyframes drift2{to{transform:translate(6%,5%) scale(1.1)}}
@keyframes drift3{to{transform:translate(-5%,-4%) scale(.94)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- frame ---------- */
.stage{position:relative;z-index:2;height:100dvh;padding:44px 52px 36px}
.frame{
  position:relative;height:100%;min-height:600px;
  display:grid;grid-template-rows:56px auto 1fr 36px;
  background:var(--frame);
  border-radius:var(--r-frame);
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 100px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
}
.frame::after{ /* lit from below */
  content:"";position:absolute;left:8%;right:8%;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(125,211,252,0) 5%,rgba(125,211,252,.85) 50%,rgba(125,211,252,0) 95%,transparent);
  box-shadow:0 0 18px 2px rgba(96,165,250,.45);pointer-events:none
}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:20px;padding:0 18px 0 22px;border-bottom:1px solid var(--line);background:linear-gradient(#0d0e12,#0b0c0f)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;letter-spacing:.22em;font-size:12px;color:#dfe3ea}
.brand svg{display:block}
.nav{display:flex;gap:4px;margin-left:18px;height:100%}
.nav a{position:relative;display:flex;align-items:center;padding:0 12px;color:var(--text-2);font-size:13px;font-weight:500;transition:color .2s}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:#fff}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:-1px;width:70%;height:22px;transform:translateX(-50%);
  background:radial-gradient(50% 100% at 50% 100%,rgba(var(--blue-rgb),.45),transparent 70%);pointer-events:none}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:1px;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.scope{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);color:var(--text-2);font-size:12px;background:#0f1115}
.scope b{font-weight:500;color:var(--text)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 14px;border-radius:10px;font-weight:500;font-size:13px;transition:transform .2s var(--ease),background .2s,box-shadow .2s}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 20px -6px rgba(var(--blue-rgb),.8),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-primary:hover{background:#6a9dff;transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--line-2);background:#121419;color:var(--text)}
.btn-ghost:hover{background:#171a20;border-color:var(--line-3)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:16px;padding:12px 18px 12px 22px;border-bottom:1px solid var(--line);min-width:0}
.tb-title{flex:none}
.tb-title h1{margin:0;font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:-.01em}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}

/* segmented control (Create UI) */
.seg{position:relative;display:flex;min-width:0;max-width:100%;padding:4px;border-radius:999px;background:#151821;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.seg-scroll{overflow-x:auto;scrollbar-width:none;border-radius:999px;min-width:0}
.seg-scroll::-webkit-scrollbar{display:none}
.seg-scroll.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.seg-scroll.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
.seg-scroll.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.seg-in{position:relative;display:flex;gap:2px;width:max-content}
.seg-ind{position:absolute;top:0;bottom:0;left:0;right:100%;border-radius:999px;background:#05060a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 1px 0 rgba(255,255,255,.04);pointer-events:none}
.seg-ind.anim{transition:left .42s var(--spring),right .42s var(--spring)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:999px;color:#969ea8;font-weight:500;font-size:13px;white-space:nowrap;transition:color .2s}
.seg button:hover{color:#d6dae1}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{color:#fff}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;padding:0 6px;border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums;border:1.5px solid rgba(255,255,255,.22);color:#cfd4dc;background:rgba(255,255,255,.03)}
.cnt.blue{border-color:#2f6bff;background:#1d2844;color:#8fb2ff}
.cnt.amber{border-color:rgba(245,165,36,.55);background:rgba(245,165,36,.08);color:var(--amber)}
.seg.icons button{padding:0 10px;height:28px}
.seg.icons svg{display:block}

/* ---------- board ---------- */
.board{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:0}
.col{position:relative;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.col:last-child{border-right:0}

/* column header: one row of title + count + inline figure, one caption line */
.ch{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"title vis" "scope cap";align-items:center;column-gap:16px;row-gap:3px;padding:13px 16px 11px 18px;border-bottom:1px solid var(--line)}
.ch-title{grid-area:title;display:flex;align-items:center;gap:8px;min-width:0;height:24px}
.ch-title svg{flex:none;display:block}
.ch-title h2{margin:0;font-size:13.5px;font-weight:500;white-space:nowrap}
.ch-med{grid-area:vis;justify-self:end;font-family:var(--display);font-weight:500;font-size:24px;line-height:26px;letter-spacing:-.015em;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
.ch-med.na{color:var(--text-3)}
.ch-scope{grid-area:scope;min-width:0;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-cap{grid-area:cap;justify-self:end;font-size:12px;color:var(--text-3);white-space:nowrap}
.ch-cap b{color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}
.cnt-chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:7px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line-2)}
.cnt-chip.blue{color:#8fb2ff;box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.4)}
.cnt-chip.amber{color:var(--amber);box-shadow:inset 0 0 0 1px rgba(245,165,36,.4)}
.list{position:relative;flex:1;min-height:0;overflow-y:auto;padding:12px 12px 24px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:#23262d transparent;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.list::-webkit-scrollbar{width:8px}
.list::-webkit-scrollbar-thumb{background:#23262d;border-radius:8px;border:2px solid var(--frame)}

/* card: always three rows, same height in every column */
.cw{position:relative;flex:none}
.card{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;height:98px;text-align:left;padding:11px 12px;border-radius:10px;background:linear-gradient(180deg,#121419,#0f1115);
  box-shadow:inset 0 0 0 1px var(--line),0 1px 0 rgba(0,0,0,.4);transition:box-shadow .2s var(--ease),background .2s;overflow:hidden;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(var(--blue-rgb),.08),transparent 60%)}
.card:hover{background:linear-gradient(180deg,#15171d,#111318);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),0 14px 30px -14px rgba(0,0,0,.85)}
.card:hover::before{opacity:1}
.card:focus-visible{outline:none;box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.9),0 0 0 3px rgba(var(--blue-rgb),.25)}
.card.sel{box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.75),0 0 0 3px rgba(var(--blue-rgb),.18)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.card .r{display:flex;align-items:center;gap:8px;height:20px;min-width:0}
.av{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:.02em;color:#d5d9e1;
  background:linear-gradient(145deg,#272a33,#16181d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.c-reg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);font-size:12.5px}
.age{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:7px;color:var(--text);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .t{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t2{flex:none;font-size:12.5px;color:var(--text-3);white-space:nowrap}
.mono{font-family:var(--mono)}
.card .t.mono{font-size:13.5px;letter-spacing:-.01em}
.oi{flex:none;display:block}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;font-size:12px;color:var(--text-3);white-space:nowrap}
.who .mono{color:var(--text-2);font-size:12px}
.idn{flex:none;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1.5px var(--frame),0 0 0 2.5px rgba(255,255,255,.08)}
.where{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.card.grp .r3{padding-right:118px}

/* chain marks: monochrome, name beside */
.cm{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:600 8.5px/1 var(--mono);letter-spacing:-.02em;color:#c6ccd6;background:#1b1e25;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.stack{display:inline-flex;align-items:center}
.stack .cm{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 0 0 2px #101216}
.stack .cm + .cm{margin-left:-5px}

/* grouped card: same address on several chains */
.xp{position:absolute;z-index:2;right:7px;top:63px;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 6px 0 5px;border-radius:8px;font-size:12px;color:var(--text-2);transition:background .15s,color .15s}
.xp:hover,.xp:focus-visible{background:rgba(255,255,255,.06);color:#fff;outline:none}
.xp:focus-visible{box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.8)}
.xp .chev{transition:transform .25s var(--ease)}
.cw.open .xp .chev{transform:rotate(180deg)}
.xw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.cw.open .xw{grid-template-rows:1fr}
.xl{min-height:0;overflow:hidden}
.cw.open .card{border-radius:10px 10px 0 0}
.xl-in{margin-top:-1px;padding:4px;border-radius:0 0 10px 10px;background:#0d0f13;box-shadow:inset 0 0 0 1px var(--line)}
.xr{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:7px;text-align:left;font-size:12.5px;color:var(--text);transition:background .15s}
.xr:hover,.xr:focus-visible{background:rgba(255,255,255,.05);outline:none}
.xr:focus-visible{box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.8)}
.xr .id{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.xr .ag{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}

.more{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;color:var(--text-3);font-size:12px;box-shadow:inset 0 0 0 1px var(--line)}
.more a{color:var(--text-2)}
.more a:hover{color:#fff}
.empty{flex:none;padding:22px 16px;border-radius:10px;text-align:center;color:var(--text-3);font-size:12px;background:rgba(255,255,255,.015);box-shadow:inset 0 0 0 1px var(--line)}
.empty b{display:block;margin-bottom:4px;color:var(--text-2);font-weight:500;font-size:13px}

/* list view */
.board.is-list{display:block;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#23262d transparent}
.lv-group{border-bottom:1px solid var(--line)}
.lv-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 22px;background:rgba(13,14,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-weight:500}
.lv-head svg{display:block}
.lv-head .cap{color:var(--text-3);font-weight:400;font-size:12px}
.lv-row{display:grid;grid-template-columns:18px minmax(170px,1fr) minmax(170px,1.2fr) 150px 170px 56px;align-items:center;gap:16px;width:100%;text-align:left;padding:0 22px;height:44px;border-bottom:1px solid rgba(255,255,255,.035);transition:background .15s}
.lv-row:hover,.lv-row:focus-visible{background:rgba(255,255,255,.03);outline:none}
.lv-row:focus-visible,.lv-row.sel{box-shadow:inset 2px 0 0 var(--blue)}
.lv-row .si{display:flex;align-items:center;justify-content:center;height:100%}
.lv-row .si svg{display:block}
.lv-row .reg{display:flex;align-items:center;gap:8px;min-width:0;color:var(--text-2)}
.lv-row .reg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-row .main{display:flex;align-items:center;gap:8px;min-width:0}
.lv-row .main .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lv-row .main .t.mono{font-size:12.5px}
.lv-row .main .t2{color:var(--text-3);font-size:12px;white-space:nowrap}
.lv-row .where{margin-left:0}
.lv-row .when{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv-row .age{margin-left:0;text-align:right}

/* ---------- status bar ---------- */
.status{display:flex;align-items:center;gap:16px;padding:0 18px 0 22px;border-top:1px solid var(--line);background:#0c0d10;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden}
.status .pill{display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 9px;border-radius:7px;background:rgba(var(--blue-rgb),.08);box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.25);color:#b8ccff}
.status .sep{width:1px;height:12px;background:var(--line-2)}
.status b{color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}
.kbd{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
kbd{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 4px;border-radius:5px;font-family:var(--mono);font-size:11px;color:var(--text-2);background:#15171c;box-shadow:inset 0 0 0 1px var(--line-2),0 1px 0 rgba(0,0,0,.5)}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(3,4,8,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:21;top:10px;right:10px;bottom:10px;width:420px;max-width:calc(100% - 20px);display:flex;flex-direction:column;border-radius:22px;
  background:linear-gradient(180deg,#121419,#0d0f13);box-shadow:0 0 0 1px rgba(255,255,255,.08),-30px 0 80px -20px rgba(0,0,0,.8);
  transform:translateX(calc(100% + 24px));transition:transform .45s var(--ease),visibility 0s .45s;visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
.sh-top{display:flex;align-items:center;gap:8px;padding:14px 14px 12px 18px;border-bottom:1px solid var(--line)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:7px;font-size:12px;color:var(--text-2);background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line-2);white-space:nowrap}
.chip svg{display:block}
.chip.v{color:#b8ccff;box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.35)}
.sh-nav{margin-left:auto;display:flex;gap:4px}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2);background:#14161b;transition:background .2s,color .2s}
.ib:hover{background:#1a1d23;color:#fff}
.ib:disabled{opacity:.35;cursor:default}
.handle{display:none}
.sh-body{flex:1;overflow-y:auto;padding:18px 18px 22px;scrollbar-width:thin;scrollbar-color:#23262d transparent}
.sh-reg{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:12.5px}
.sh-title{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:22px;font-weight:500;letter-spacing:-.01em;word-break:break-all}
.sh-title.mono{font-family:var(--mono);font-size:20px}
.sh-ev{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-size:13px;color:var(--text-2)}
.sh-ev b{color:#fff;font-weight:500}
.sh-ev i{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
.ctx{margin:18px 0 4px;padding:14px 14px 12px;border-radius:14px;background:rgba(255,255,255,.02);box-shadow:inset 0 0 0 1px var(--line)}
.ctx-h{font-size:12px;color:var(--text-3);margin-bottom:10px}

.ctx > svg{display:block;width:100%;height:auto;overflow:visible}
.ctx .xr{padding:0 6px}
.ctx .xr.cur{background:rgba(var(--blue-rgb),.08);box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.3)}
.props{margin:16px 0 0;display:grid;grid-template-columns:116px 1fr;font-size:12.5px}
.props dt{color:var(--text-3);padding:9px 0;border-top:1px solid var(--line)}
.props dd{margin:0;padding:9px 0;border-top:1px solid var(--line);color:var(--text);min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.props dd .mono{font-size:12px;word-break:break-all}
.props dd .dim{color:var(--text-3)}
.copy{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-size:12px;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2);background:#15171c}
.copy:hover{color:#fff}
.sh-foot{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.sh-foot .btn{flex:1}

/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;padding:8px 10px;border-radius:10px;background:#0c0e12;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 12px 30px -10px rgba(0,0,0,.9);font-size:12px;color:var(--text-2);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:280px}
.tip.on{opacity:1;transform:none}
.tip b{color:#fff;font-weight:500}
.tip .r{display:flex;justify-content:space-between;gap:14px}

/* mobile status tabs (hidden on desktop) */
.mtabs{display:none}


/* ---------- flow summary (toolbar) ---------- */
.flow{flex:none;display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.fl-lab{margin-right:4px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.fl{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:999px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--line-2)}
.fl svg{display:block;flex:none}
.fl b{font-family:var(--display);font-weight:600;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.fl-ar{display:block;flex:none;color:#5d6574}
.toolbar > #regSeg{margin-left:auto}
.tb-r{margin-left:0}

/* ---------- age ring, oldest flag, outcome groups, footnotes ---------- */
.ring{display:block;flex:none;overflow:visible}
.ring .trk{stroke:rgba(255,255,255,.1)}
@keyframes ringIn{from{stroke-dasharray:0 var(--C)}}
.old{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px 0 7px;border-radius:999px;font-size:11.5px;font-weight:500;color:var(--text);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line-3)}
.old i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 7px var(--c)}
.card.is-old{background:linear-gradient(180deg,#15171d,#101216)}
.gh{flex:none;display:flex;align-items:center;gap:8px;padding:8px 4px 0 6px;font-size:12.5px;font-weight:500;color:var(--text)}
.gh:first-child{padding-top:0}
.gh .oi{display:block}
.gh-n{margin-left:auto;font-weight:400;color:var(--text-2);font-variant-numeric:tabular-nums}
.gh-n b{color:var(--text);font-weight:500}
.cf{flex:none;margin:0;padding:9px 16px 11px 18px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.45;color:var(--text-3)}
.cf b{color:var(--text-2);font-weight:500}
.lv-sub{display:flex;align-items:center;gap:8px;padding:8px 22px 6px 22px;font-size:12px;font-weight:500;color:var(--text-2);border-bottom:1px solid rgba(255,255,255,.035)}
.lv-sub .gh-n{margin-left:8px}
.lv-head .cnt-chip{height:20px}
.lv-row .age{justify-content:flex-end}
.lv-row .main .old{margin-left:6px}
.lv-row .main .t + .old{margin-left:8px}
.lv-row{grid-template-columns:18px minmax(170px,1fr) minmax(170px,1.2fr) 150px 170px 150px}
.status .fn{color:var(--text-3)}
.status .fn b{color:var(--text-2);font-weight:500}
.strip text{font-family:var(--font);font-size:12px;fill:#8a92a0}
.strip .lab{fill:#c9ced8}

/* ---------- entrance: only while the board carries .intro, which JS removes after 640ms.
   Every delay is at most 300ms and every run 300ms, so the board is complete by 600ms. ---------- */
.intro .cw,.intro .burst,.intro .more,.intro .gh,.intro .empty,.intro .lv-row,.intro .lv-sub{animation:rise .3s var(--ease) backwards;animation-delay:var(--d,0ms)}
.intro .ring .arc{animation:ringIn .3s var(--ease) backwards;animation-delay:var(--d,0ms)}

/* micro-labels: say what a ring, an age or a figure row measures, right where it sits */
.ml{flex:none;font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);white-space:nowrap}
.age .ml{margin-left:-1px}

/* list figures row (open + decided cards): the card registry's own columns */
.rf{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;font-size:12px;color:var(--text-3);white-space:nowrap}
.rf b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.rf .ml{margin-right:1px}
.rf .dv{flex:none;width:3px;height:3px;border-radius:50%;background:#5d6574}
.rf .oi + b{margin-left:-2px}
.ent{margin-left:auto;flex:none;font-size:12px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.ent b{color:var(--text-2);font-weight:500}

/* ---------- In court: disputes grouped by burst (arrival batches) ---------- */
.ch-med{height:26px}
.ch-med small{font-family:var(--font);font-size:13px;font-weight:500;line-height:1;letter-spacing:0;color:var(--text-2)}
.burst{position:relative;flex:none;border-radius:12px;background:linear-gradient(180deg,#121419,#0f1115);box-shadow:inset 0 0 0 1px var(--line),0 1px 0 rgba(0,0,0,.4)}
.burst.multi{background:linear-gradient(180deg,rgba(245,165,36,.055),rgba(245,165,36,0) 70%),linear-gradient(180deg,#121419,#0f1115);box-shadow:inset 0 0 0 1px rgba(245,165,36,.2),0 1px 0 rgba(0,0,0,.4)}
.bh{display:flex;flex-direction:column;gap:6px;padding:11px 12px 6px}
.bh .r{display:flex;align-items:center;gap:8px;height:22px;min-width:0}
.bage{margin-left:auto;flex:none;display:inline-flex;align-items:baseline;gap:7px;white-space:nowrap}
.bage b{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.01em;color:var(--text);font-variant-numeric:tabular-nums}
.bk{display:inline-flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap}
.pips{flex:none;display:inline-flex;gap:3px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 6px rgba(245,165,36,.55)}
.burst:not(.multi) .pips i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--amber)}
.bt{margin-left:auto;flex:none;font-size:12px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.brows{padding:0 4px 4px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;height:32px;padding:0 8px;border-radius:8px;text-align:left;font-size:13px;color:var(--text);transition:background .15s,box-shadow .15s}

.brow .off{font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.brow .off .ml{margin-right:6px}
.bf{display:flex;align-items:center;gap:8px;padding:8px 12px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3);white-space:nowrap;min-width:0}
.bf span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.bf b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.meter{flex:none;position:relative;width:56px;height:5px;margin-left:auto;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--amber);box-shadow:0 0 6px rgba(245,165,36,.6)}
.lv-sub .pips{margin-right:2px}
.lv-row .age .ml{margin-right:2px}
.ctx .xr .tm{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums}
.ctx .xr .pip{width:7px;height:7px;border-radius:50%;background:var(--amber);justify-self:center}

/* ---------- responsive ---------- */
@media (max-width: 1560px){ .kbd{display:none} }
@media (max-width: 1280px){ .stage{padding:36px 40px 30px} }
@media (max-width: 1180px){
  .nav a.opt{display:none}
  .status .md-hide,.status .sep:has(+ .md-hide){display:none}
  .flow .fl-lab{display:none}
}
@media (max-width: 860px){
  body{overflow:auto}
  .stage{height:auto;min-height:100dvh;padding:16px 14px 18px}
  .frame{height:auto;min-height:calc(100dvh - 34px);grid-template-rows:auto auto auto auto;--r-frame:24px}
  .top{height:54px;padding:0 10px 0 16px}
  .nav,.scope{display:none}
  .toolbar{flex-wrap:wrap;padding:12px 14px 12px;gap:10px}
  .tb-title{order:1}
  .tb-r{order:2;margin-left:auto}
  .mtabs{order:4;display:flex;width:100%}
  .mtabs .seg-in{width:100%}
  .mtabs button{flex:1;justify-content:center;padding:0 8px}
  .toolbar > #regSeg{order:5;width:100%}
  .board{display:block}
  .col{display:none;border-right:0}
  .col.active{display:flex;animation:swap .35s var(--ease) both}
  .col.from-l{animation-name:swapL}
  @keyframes swap{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
  @keyframes swapL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  .ch{grid-template-areas:"scope vis" "scope cap";padding:12px 14px 10px 16px;row-gap:2px}
  .ch-title{display:none}
  .ch-scope{white-space:normal;font-size:12.5px;color:var(--text-2);align-self:center}
  .flow{order:3;width:100%;justify-content:space-between;gap:4px;padding:0;font-size:12px}
  .fl{gap:5px;padding:0 8px 0 6px}
  .fl b{font-size:14px}
  .fl-ar{width:12px}
  .flow .fl-lab{display:none}
  .toolbar > #regSeg{margin-left:0}
  .cf{padding:10px 16px 14px}
  .meter{width:40px}
  .bt{font-size:11.5px}
  .list{overflow:visible;-webkit-mask-image:none;mask-image:none;padding:12px 10px 18px}
  .board.is-list{overflow:visible}
  .lv-group{display:none}
  .lv-group.active{display:block}
  .lv-head{position:static;padding:10px 16px}
  .lv-row{grid-template-columns:24px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:2px 12px;height:auto;padding:10px 16px}
  .lv-row .si,.lv-row .whocell{display:none}
  .lv-row .reg{display:contents}
  .lv-row .reg .av{grid-column:1;grid-row:1 / span 2;align-self:center}
  .lv-row .reg > span:not(.av){grid-column:2;grid-row:2;font-size:12px;color:var(--text-3)}
  .lv-row .main{grid-column:2;grid-row:1}
  .lv-row .age{grid-column:3;grid-row:1}
  .lv-row .wcell{grid-column:3;grid-row:2;justify-self:end}
  .lv-row .wcell .where span:last-child{display:none}
  .status{flex-wrap:wrap;gap:8px 12px;padding:10px 14px;height:auto;white-space:normal}
  .status .sep,.kbd,.status .xs-hide{display:none}
  .sheet{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:86dvh;border-radius:24px 24px 0 0;transform:translateY(105%)}
  .sheet.on{transform:none}
  .scrim{position:fixed}
  .handle{display:block;width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:8px auto 0}
  .sh-nav .ib.nav-btn{display:none}
}
@media (max-width: 400px){
  .tb-title h1{font-size:18px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

  /* ---------- icons ---------- */
  var CHEV = '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ARROW = '<svg class="fl-ar" width="16" height="10" viewBox="0 0 16 10" aria-hidden="true"><path d="M1 5h13M10 1.5L14 5l-4 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON = {
    open: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--blue)" stroke-width="1.5"/></svg>',
    court: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--amber)" stroke-width="1.5"/><path d="M7 3.2A3.8 3.8 0 0 1 7 10.8z" fill="var(--amber)"/></svg>',
    decided: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.25" fill="var(--neutral)"/><path d="M4.4 7.1l1.8 1.8 3.5-3.6" fill="none" stroke="#0a0b0e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  /* ruling outcomes: blue = registered (the accent), light = rejected, hollow = removed; the glyph carries the meaning */
  var OUT = {
    registered: { label: "Registered", fill: "var(--blue)", glyph: function(c, s){ return '<path d="M' + (c - s * .3) + ' ' + (c + s * .02) + 'l' + (s * .2) + ' ' + (s * .2) + 'l' + (s * .38) + ' -' + (s * .4) + '" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'; } },
    rejected: { label: "Rejected", fill: "var(--neutral)", glyph: function(c, s){ var k = s * .2; return '<path d="M' + (c - k) + ' ' + (c - k) + 'l' + (2 * k) + ' ' + (2 * k) + 'M' + (c + k) + ' ' + (c - k) + 'l-' + (2 * k) + ' ' + (2 * k) + '" stroke="#0a0b0e" stroke-width="1.5" stroke-linecap="round"/>'; } },
    removed: { label: "Removed", fill: "none", glyph: function(c, s){ return '<path d="M' + (c - s * .22) + ' ' + c + 'h' + (s * .44) + '" stroke="#a7adba" stroke-width="1.5" stroke-linecap="round"/>'; } }
  };
  var OUT_ORDER = ["registered", "rejected", "removed"];
  function outIcon(k, s){
    s = s || 14; var o = OUT[k], c = s / 2, r = s / 2 - .75;
    return '<svg class="oi" width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + ' ' + s + '" aria-hidden="true"><circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="' + o.fill + '"' + (o.fill === "none" ? ' stroke="#7c8494" stroke-width="1.3"' : '') + '/>' + o.glyph(c, s) + '</svg>';
  }

  /* ---------- model: three pipeline stages, each card is one snapshot row ---------- */
  var COLS = [
    { key: "open", title: "Open to challenge", tab: "Open", items: S.openToChallenge, icon: ICON.open, tone: "blue", color: "var(--blue)",
      one: "request", many: "requests", verb: "Requested", since: "since request", at: "requested at" },
    { key: "court", title: "In court", tab: "In court", items: S.inCourt, icon: ICON.court, tone: "amber", color: "var(--amber)",
      one: "dispute", many: "disputes", verb: "Challenged", since: "since challenge", at: "challenged at" },
    { key: "decided", title: "Decided", tab: "Decided", items: S.decided, icon: ICON.decided, tone: "", color: "var(--neutral)",
      one: "ruling", many: "rulings", verb: "Ruled", since: "since ruling", at: "ruled at" }
  ];
  var COLMAP = {}; COLS.forEach(function(c, i){ c.index = i; COLMAP[c.key] = c; });

  // the same address requested on several chains stacks into one card (each chain is still its own request)
  function groupOpen(items){
    var map = {}, out = [];
    items.forEach(function(e, i){
      var c = caip(e.id), k = e.registry + "|" + (c ? c.addr.toLowerCase() : i);
      if (!(k in map)){ map[k] = out.length; out.push({ lead: i, members: [] }); }
      out[map[k]].members.push(i);
    });
    return out;
  }
  COLS.forEach(function(c){
    c.units = c.key === "open" ? groupOpen(c.items) : c.items.map(function(e, i){ return { lead: i, members: [i] }; });
    c.unitOf = {}; c.units.forEach(function(u){ u.members.forEach(function(m){ c.unitOf[m] = u; }); });
  });

  // registry filter: registries that have cards on the board, most cards first
  var regCount = {};
  COLS.forEach(function(c){ c.items.forEach(function(e){ regCount[e.registry] = (regCount[e.registry] || 0) + 1; }); });
  var REGS = Object.keys(regCount).sort(function(a, b){ return regCount[b] - regCount[a]; });

  var state = { reg: "all", view: "board", mcol: "open", sel: null, item: null, sheetOpen: false, open: {} };

  function matches(e){ return state.reg === "all" || e.registry === state.reg; }
  function ageOf(e){ return SNAP - e.at; }

  /* per column: rows shown, median age, oldest row (all from the snapshot rows under the current filter) */
  function statsOf(col){
    var rows = [], ages = [], oldest = null, oldestAge = null;
    col.items.forEach(function(e, i){
      if (!matches(e)) return;
      var a = ageOf(e); rows.push(i); ages.push(a);
      if (oldestAge === null || a > oldestAge){ oldestAge = a; oldest = i; }
    });
    return { rows: rows, ages: ages, n: rows.length, med: median(ages), oldest: oldest, oldestAge: oldestAge };
  }
  function outcomeCounts(){
    var oc = { registered: 0, rejected: 0, removed: 0 };
    S.decided.forEach(function(e){ if (matches(e)) oc[e.outcome]++; });
    return oc;
  }
  // decided groups: largest group first
  function groupOrder(oc){
    return OUT_ORDER.filter(function(k){ return oc[k]; }).sort(function(a, b){ return oc[b] - oc[a] || OUT_ORDER.indexOf(a) - OUT_ORDER.indexOf(b); });
  }
  // cards in display order (decided: by outcome group, newest first inside a group)
  function units(col){
    if (col.key === "court"){
      var ord = [];
      burstsOf().forEach(function(b){ b.members.forEach(function(m){ ord.push(col.unitOf[m]); }); });
      return ord;
    }
    var us = col.units.filter(function(u){ return matches(col.items[u.lead]); });
    if (col.key === "decided"){
      var go = groupOrder(outcomeCounts());
      us = us.slice().sort(function(a, b){
        var ea = col.items[a.lead], eb = col.items[b.lead];
        return go.indexOf(ea.outcome) - go.indexOf(eb.outcome) || eb.at - ea.at;
      });
    }
    return us;
  }
  function noun(col, n){ return n + " " + (n === 1 ? col.one : col.many); }
  // entrance delay for the k-th element of column ci: never more than 300ms
  function dl(ci, k){ return Math.min(300, ci * 60 + k * 30) + "ms"; }

  /* ---------- list figures: the card registry's own row in the top-registries table ---------- */
  // The snapshot names registries by title and some titles repeat (three "Address Tags" lists on Gnosis):
  // a card takes the row with the same title and chain that has the most open requests, then the most entries.
  var REGROW = {};
  function regRow(title, chain){
    var k = title + "|" + chain;
    if (!(k in REGROW)){
      var best = null;
      S.topRegistries.forEach(function(r){
        if (r.title !== title || r.chain !== chain) return;
        if (!best || r.open > best.open || (r.open === best.open && r.entries > best.entries)) best = r;
      });
      REGROW[k] = best;
    }
    return REGROW[k];
  }
  function sameTitle(title, chain){ return S.topRegistries.filter(function(r){ return r.title === title && r.chain === chain; }).length; }
  function pct(a, b){ return b ? (Math.round(a / b * 1000) / 10) + "%" : "–"; }
  // rulings per outcome for one registry title, over the decided rows of the snapshot
  function tallyOf(title){
    var t = { registered: 0, rejected: 0, removed: 0, n: 0 };
    S.decided.forEach(function(e){ if (e.registry === title){ t[e.outcome]++; t.n++; } });
    return t;
  }

  /* ---------- bursts: disputes that reached court in one batch ---------- */
  var BURST_GAP = 3600;   // a dispute challenged less than 60 min after the previous one joins its burst
  function uniq(a){ return a.filter(function(x, i){ return a.indexOf(x) === i; }); }
  function spanMin(sec){ return Math.max(1, Math.ceil(sec / 60)) + " min"; }
  function offs(sec){ var m = Math.floor(sec / 60), x = Math.floor(sec % 60); return m + "m " + pad(x) + "s"; }
  // bursts over the In court rows under the current filter: newest burst first, disputes in arrival order inside
  function burstsOf(){
    var col = COLMAP.court, rows = [], out = [];
    col.items.forEach(function(e, i){ if (matches(e)) rows.push(i); });
    rows.sort(function(a, b){ return col.items[a].at - col.items[b].at; });
    rows.forEach(function(i){
      var b = out[out.length - 1];
      if (b && col.items[i].at - col.items[b.members[b.members.length - 1]].at < BURST_GAP) b.members.push(i);
      else out.push({ members: [i] });
    });
    out.forEach(function(b){
      var f = col.items[b.members[0]], l = col.items[b.members[b.members.length - 1]];
      b.n = b.members.length; b.first = f.at; b.last = l.at; b.span = l.at - f.at; b.age = SNAP - f.at;
      b.regs = uniq(b.members.map(function(m){ return col.items[m].registry; }));
      b.actors = uniq(b.members.map(function(m){ return col.items[m].actor; }));
    });
    return out.reverse();
  }
  function burstOf(idx){ return burstsOf().filter(function(b){ return b.members.indexOf(idx) >= 0; })[0]; }
  function burstWhen(b){
    if (b.n === 1) return dShort(b.first) + ", " + dTime(b.first) + " UTC";
    if (dShort(b.first) !== dShort(b.last)) return dShort(b.first) + " " + dTime(b.first) + " – " + dShort(b.last) + " " + dTime(b.last) + " UTC";
    return dShort(b.first) + ", " + dTime(b.first) + "–" + dTime(b.last) + " UTC";
  }
  function burstLine(b){ return b.n > 1 ? b.n + " disputes within " + spanMin(b.span) : "Lone dispute"; }
  function pips(n){ var x = ""; for (var i = 0; i < n; i++) x += "<i></i>"; return '<span class="pips" aria-hidden="true">' + x + '</span>'; }

  /* ---------- segmented controls ---------- */
  function placeInd(seg, btn, animate){
    var ind = seg.querySelector(".seg-ind"), inner = seg.querySelector(".seg-in");
    if (!btn || !ind || !btn.offsetWidth) return;
    var l = btn.offsetLeft, w = btn.offsetWidth, W = inner.offsetWidth, r = W - (l + w);
    var prevL = parseFloat(ind.dataset.l || "-1");
    if (animate && !RM && prevL >= 0){
      var right = l > prevL;
      ind.classList.add("anim");
      ind.style.transition = right ? "right .32s var(--spring), left .46s var(--spring) .05s" : "left .32s var(--spring), right .46s var(--spring) .05s";
    } else { ind.style.transition = "none"; }
    ind.style.left = l + "px"; ind.style.right = r + "px"; ind.dataset.l = l;
    var sc = seg.querySelector(".seg-scroll");
    if (sc && sc.scrollWidth > sc.clientWidth){
      sc.scrollTo({ left: l - (sc.clientWidth - w) / 2, behavior: RM || !animate ? "auto" : "smooth" });
    }
  }
  function updFade(sc){
    var over = sc.scrollWidth > sc.clientWidth + 2;
    sc.classList.toggle("fade-l", over && sc.scrollLeft > 2);
    sc.classList.toggle("fade-r", over && sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 2);
  }

  function buildRegSeg(){
    var seg = $("#regSeg"), inner = seg.querySelector(".seg-in");
    var html = '<span class="seg-ind"></span><button type="button" data-reg="all" aria-pressed="true">All registries</button>';
    REGS.forEach(function(t){
      html += '<button type="button" data-reg="' + esc(t) + '" aria-pressed="false" title="Show only ' + esc(t) + '">' + esc(shortName(t)) + '</button>';
    });
    inner.innerHTML = html;
    inner.addEventListener("click", function(ev){
      var b = ev.target.closest("button"); if (!b) return;
      setReg(b.getAttribute("data-reg"));
    });
    var sc = seg.querySelector(".seg-scroll");
    sc.addEventListener("scroll", function(){ updFade(sc); }, { passive: true });
  }
  function syncRegSeg(animate){
    var seg = $("#regSeg"), btn = null;
    seg.querySelectorAll("button").forEach(function(b){
      var on = b.getAttribute("data-reg") === state.reg; b.setAttribute("aria-pressed", on); if (on) btn = b;
    });
    placeInd(seg, btn, animate);
    var sc = seg.querySelector(".seg-scroll"); updFade(sc);
    if (animate) setTimeout(function(){ updFade(sc); }, 420);
  }
  function setReg(r){
    if (state.reg === r) return;
    state.reg = r; syncRegSeg(true); render();
  }

  function buildMTabs(){
    var inner = $("#mtabs .seg-in");
    var html = '<span class="seg-ind"></span>';
    COLS.forEach(function(c){
      html += '<button type="button" role="tab" data-col="' + c.key + '" aria-selected="' + (c.key === state.mcol) + '">' + c.tab +
        '<span class="cnt ' + (c.tone || "") + '" data-mcount="' + c.key + '"></span></button>';
    });
    inner.innerHTML = html;
    inner.addEventListener("click", function(ev){
      var b = ev.target.closest("button"); if (!b) return; setMCol(b.getAttribute("data-col"));
    });
  }
  function syncMTabs(animate){
    var seg = $("#mtabs"), btn = null;
    seg.querySelectorAll("button").forEach(function(b){ var on = b.getAttribute("data-col") === state.mcol; b.setAttribute("aria-selected", on); if (on) btn = b; });
    seg.querySelectorAll("[data-mcount]").forEach(function(el){ el.textContent = fmt(statsOf(COLMAP[el.getAttribute("data-mcount")]).n); });
    if (MOBILE.matches) placeInd(seg, btn, animate);
  }
  function setMCol(k){
    if (state.mcol === k) return;

    document.querySelectorAll("[data-colwrap]").forEach(function(el){
      var on = el.getAttribute("data-colwrap") === k;
      el.classList.toggle("active", on); el.classList.toggle("from-l", on && fromLeft);
    });
  }

  function syncViewSeg(animate){
    var seg = $("#viewSeg"), btn = null;
    seg.querySelectorAll("button").forEach(function(b){ var on = b.getAttribute("data-view") === state.view; b.setAttribute("aria-pressed", on); if (on) btn = b; });
    placeInd(seg, btn, animate);
  }
  $("#viewSeg").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if (!b) return; setView(b.getAttribute("data-view"));
  });
  function setView(v){ if (state.view === v) return; state.view = v; syncViewSeg(true); render(); }

  /* ---------- flow summary: stage counts as the snapshot reports them ---------- */
  function renderFlow(){
    var nodes = [
      { icon: ICON.open, n: S.figures.requestsOpen, label: "open" },
      { icon: ICON.court, n: S.figures.inCourt, label: "in court" },
      { icon: ICON.decided, n: S.decided.length, label: "decided" }
    ];
    var el = $("#flow");
    el.innerHTML = '<span class="fl-lab">Flow</span>' + nodes.map(function(x){
      return '<span class="fl">' + x.icon + '<b>' + fmt(x.n) + '</b>' + x.label + '</span>';
    }).join(ARROW);
    el.setAttribute("aria-label", "Pipeline flow in the snapshot: " + fmt(nodes[0].n) + " open requests, then " + fmt(nodes[1].n) + " disputes in court, then " + fmt(nodes[2].n) + " rulings listed");
  }

  /* ---------- column header: count + median age ---------- */
  function scopeText(col, st){
    var L = col.items.length;
    if (col.key === "open"){
      if (state.reg === "all") return "latest " + L + " of " + fmt(S.figures.requestsOpen) + " open requests";
      return st.n + " of the latest " + L + " requests";
    }
    if (col.key === "court"){
      if (state.reg === "all") return (L === S.figures.inCourt ? "all " + L : "latest " + L + " of " + fmt(S.figures.inCourt)) + " disputes before jurors";
      return st.n + " of " + L + " disputes";
    }
    if (state.reg === "all") return "latest " + L + " rulings";
    return st.n + " of the latest " + L + " rulings";
  }
  function header(col, st){
    return '<div class="ch">' +
      '<div class="ch-title">' + col.icon + '<h2 id="h-' + col.key + '">' + col.title + '</h2>' +
        '<span class="cnt-chip ' + col.tone + '" aria-label="' + esc(noun(col, st.n)) + ' in this column">' + st.n + '</span></div>' +
      headFig(col, st) +
      '<div class="ch-scope">' + esc(scopeText(col, st)) + '</div>' +
    '</div>';
  }
  function headFig(col, st){
    if (col.key === "court"){
      var bs = burstsOf(), big = null;
      bs.forEach(function(b){ if (!big || b.n > big.n) big = b; });
      return '<div class="ch-med' + (bs.length ? '' : ' na') + '" data-tip-bursts="1">' + (bs.length ? bs.length + '<small> ' + (bs.length === 1 ? 'burst' : 'bursts') + '</small>' : '–') + '</div>' +
        '<div class="ch-cap">' + (!bs.length ? 'no dispute' : big.n > 1 ? 'largest <b>' + big.n + ' within ' + spanMin(big.span) + '</b>' : 'none within 60 min of another') + '</div>';
    }
    return '<div class="ch-med' + (st.med === null ? ' na' : '') + '" data-tip-med="' + col.key + '">' + (st.med === null ? '–' : age(st.med)) + '</div>' +
      '<div class="ch-cap">median age' + (st.oldestAge === null ? '' : ' · oldest <b>' + age(st.oldestAge) + '</b>') + '</div>';
  }
  function footnote(col, st){
    var s = '<b>Median age</b> = median of (snapshot time − requested at), ' + noun(col, st.n) + ' shown. <b>Ring</b> = card age ÷ oldest card age in column. <b>List</b> = the card registry\'s open requests and disputes in court (top-registries row, same title and chain).';
    if (col.key === "court") s = '<b>Burst</b> = disputes challenged less than 60 min after the previous one, ' + noun(col, st.n) + ' shown. <b>In court</b> = snapshot time − the burst\'s first challenge; <b>+7m 10s</b> style offsets = time after that challenge. <b>List</b> = registry disputes in court ÷ its open requests.';
    if (col.key === "decided") s = '<b>Median age</b> = median of (snapshot time − ruled at), ' + noun(col, st.n) + ' shown. <b>Ring</b> = card age ÷ oldest in column. <b>Groups</b> = rulings per outcome. <b>Rulings here</b> = the card registry\'s rulings per outcome in the latest ' + col.items.length + '.';
    return '<p class="cf">' + s + '</p>';
  }

  /* ---------- age ring: card age as a share of the oldest card's age in the same column ---------- */
  function ring(col, sec, oldestAge, size){
    size = size || 20;
    var sw = 2.4, c = size / 2, r = c - sw / 2 - .4, C = 2 * Math.PI * r, f = oldestAge ? Math.min(1, sec / oldestAge) : 0, d = C * f;
    return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="Age ring: ' + Math.round(f * 100) + '% of the oldest card age in this column">' +
      '<circle class="trk" cx="' + c + '" cy="' + c + '" r="' + r.toFixed(2) + '" fill="none" stroke-width="' + sw + '"/>' +
      '<circle class="arc" cx="' + c + '" cy="' + c + '" r="' + r.toFixed(2) + '" fill="none" stroke="' + col.color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-dasharray="' + d.toFixed(2) + ' ' + C.toFixed(2) + '" transform="rotate(-90 ' + c + ' ' + c + ')" style="--C:' + C.toFixed(2) + '" filter="drop-shadow(0 0 2px ' + col.color + ')"/>' +
    '</svg>';
  }

  /* ---------- cards ---------- */
  function who(e){ return '<span class="who">by <i class="idn" style="' + identicon(e.actor) + '"></i><span class="mono">' + esc(e.actor) + '</span></span>'; }
  function mainLine(col, e){
    if (col.key === "open"){ var c = caip(e.id); return '<span class="t mono">' + shortAddr(c.addr) + '</span>'; }
    if (col.key === "court") return '<span class="t">' + esc(e.status) + '</span>';
    return outIcon(e.outcome, 14) + '<span class="t">' + OUT[e.outcome].label + '</span><span class="t2">by ruling</span>';
  }
  function chainsOf(u, col){ return u.members.map(function(m){ return caip(col.items[m].id).chain; }); }
  function stack(ids, max){
    max = max || 3; var s = ids.slice(0, max).map(mark).join("");
    return '<span class="stack" aria-hidden="true">' + s + '</span>';
  }
  function isOldest(u, st){ return st.oldest !== null && u.members.indexOf(st.oldest) >= 0; }
  function cardLabel(col, u, st){
    var e = col.items[u.lead], sec = ageOf(e);
    var what = col.key === "open" ? shortAddr(caip(e.id).addr) + (u.members.length > 1 ? " on " + u.members.length + " chains" : " on " + chainOf(caip(e.id).chain).name) : e.status;
    return col.title + ": " + shortName(e.registry) + ", " + what + ", " + ageFull(sec) + " " + col.since + (isOldest(u, st) ? ", oldest in this column" : "");
  }
  function oldTag(){ return '<span class="old"><i></i>Oldest</span>'; }
  function listFigs(e){
    var r = regRow(e.registry, e.chain);
    if (!r) return '<span class="rf"><span class="ml">List</span>not in the top-registries table</span>';
    return '<span class="rf" data-tip-list="' + esc(e.registry + "|" + e.chain) + '"><span class="ml">List</span><b>' + fmt(r.open) + '</b> open<i class="dv"></i><b>' + fmt(r.inCourt) + '</b> in court</span>';
  }
  function tallyFigs(e){
    var t = tallyOf(e.registry);
    return '<span class="rf" data-tip-tally="' + esc(e.registry) + '"><span class="ml">Rulings here</span>' +
      OUT_ORDER.filter(function(k){ return t[k]; }).map(function(k){ return outIcon(k, 12) + '<b>' + t[k] + '</b>'; }).join('') +
      '<span>of ' + t.n + ' listed</span></span>';
  }
  function entFigs(e){
    var r = regRow(e.registry, e.chain);
    return r ? '<span class="ent" data-tip-list="' + esc(e.registry + "|" + e.chain) + '"><b>' + fmt(r.entries) + '</b> entries</span>' : '';
  }
  function listDd(e){
    var r = regRow(e.registry, e.chain);
    if (!r) return '<span class="dim">not in the top-registries table</span>';
    return fmt(r.inCourt) + ' of ' + fmt(r.open) + ' open requests in court (' + pct(r.inCourt, r.open) + ') · ' + fmt(r.entries) + ' entries' + (sameTitle(e.registry, e.chain) > 1 ? ' <span class="dim">(' + sameTitle(e.registry, e.chain) + ' lists share this title on ' + esc(e.chain) + '; figures from the one with the most open requests)</span>' : '');
  }
  function browLabel(b, m){
    var e = COLMAP.court.items[m];
    return "In court: " + shortName(e.registry) + ", " + e.status + ", " + (b.n > 1 ? "burst of " + b.n + " within " + spanMin(b.span) + ", " + offs(e.at - b.first) + " after the first" : "lone dispute") + ", burst in court " + ageFull(b.age);

        '<dt>List figures</dt><dd>' + listDd(e) + '</dd>';
    } else {
      title = '<h3 class="sh-title" id="shTitle">' + outIcon(e.outcome, 22) + esc(e.status) + '</h3>';
      var tl = tallyOf(e.registry);
      props = '<dt>Ruling</dt><dd>' + OUT[e.outcome].label + '</dd>' +
        '<dt>Requested by</dt><dd>' + who(e).replace('>by <', '><') + '</dd>' +
        '<dt>Registry chain</dt><dd>' + esc(e.chain) + '</dd>' +
        '<dt>Rulings here</dt><dd>' + OUT_ORDER.filter(function(k){ return tl[k]; }).map(function(k){ return tl[k] + ' ' + OUT[k].label.toLowerCase(); }).join(' · ') + ' <span class="dim">of the latest ' + S.decided.length + ' rulings</span></dd>' +
        '<dt>List figures</dt><dd>' + listDd(e) + '</dd>';
    }
    $("#shBody").innerHTML =
      '<div class="sh-reg"><span class="av" aria-hidden="true">' + initials(e.registry) + '</span>' + esc(e.registry) + '</div>' + title + evLine + ctx + group +
      '<dl class="props">' + props + '</dl>';
    $("#shFoot").innerHTML = col.key === "open"
      ? '<a class="btn btn-ghost" href="#">Open item</a><a class="btn btn-primary" href="#">Challenge</a>'
      : col.key === "court" ? '<a class="btn btn-ghost" href="#">Open item</a><a class="btn btn-primary" href="#">View dispute</a>'
      : '<a class="btn btn-ghost" href="#">Open item</a><a class="btn btn-primary" href="#">View ruling</a>';
    var order = visibleOrder(), pos = order.indexOf(leadId);
    $("#shPrev").disabled = pos <= 0; $("#shNext").disabled = pos >= order.length - 1;
    if (!state.sheetOpen){
      lastFocus = document.activeElement;
      hideTip();
      state.sheetOpen = true; sheet.classList.add("on"); scrim.classList.add("on"); sheet.setAttribute("aria-hidden", "false");
      if (!keepFocus) setTimeout(function(){ $("#shClose").focus({ preventScroll: true }); }, RM ? 0 : 120);
    }
    $("#shBody").scrollTop = 0;
  }
  function closeSheet(){
    if (!state.sheetOpen) return;
    state.sheetOpen = false; sheet.classList.remove("on"); scrim.classList.remove("on"); sheet.setAttribute("aria-hidden", "true");
    var el = state.sel && document.querySelector('[data-card="' + state.sel + '"]');
    if (el) el.focus({ preventScroll: true }); else if (lastFocus) lastFocus.focus({ preventScroll: true });
  }
  function step(dir){
    var order = visibleOrder(); if (!order.length) return;
    var cur = state.sel || (document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-card"));
    var pos = order.indexOf(cur), next = order[Math.max(0, Math.min(order.length - 1, pos < 0 ? 0 : pos + dir))];
    var nc = next.split(":")[0]; if (MOBILE.matches && nc !== state.mcol) setMCol(nc);
    if (state.sheetOpen) openSheet(next, true);
    else { state.sel = next; focusCard(next); }
  }
  function focusCard(id){
    document.querySelectorAll(".card.sel,.lv-row.sel,.brow.sel").forEach(function(x){ x.classList.remove("sel"); });
    var el = document.querySelector('[data-card="' + id + '"]');
    if (el){ el.focus({ preventScroll: true }); el.scrollIntoView({ block: "nearest", behavior: RM ? "auto" : "smooth" }); }
  }
  function stepCol(dir){
    var cur = state.sel || (document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute("data-card")) || "open:-1";
    var ci = COLMAP[cur.split(":")[0]].index;
    if (cur === "open:-1" && dir > 0) ci = -1;
    for (var k = 1; k <= 3; k++){
      var nc = COLS[ci + dir * k]; if (!nc) return;
      var us = units(nc); if (us.length){
        var id = nc.key + ":" + us[0].lead;
        if (MOBILE.matches) setMCol(nc.key);
        if (state.sheetOpen) openSheet(id, true); else { state.sel = id; focusCard(id); }
        return;
      }
    }
  }
  function toggleGroup(id, btn){
    var wrap = btn.closest(".cw"), on = !state.open[id];
    state.open[id] = on;
    wrap.classList.toggle("open", on);
    btn.setAttribute("aria-expanded", on);
    var xl = wrap.querySelector(".xl"); if (on) xl.removeAttribute("inert"); else xl.setAttribute("inert", "");
  }

  $("#board").addEventListener("click", function(ev){
    var x = ev.target.closest("[data-xp]"); if (x){ toggleGroup(x.getAttribute("data-xp"), x); return; }
    var it = ev.target.closest("[data-item]"); if (it){ openSheet(it.getAttribute("data-item")); return; }
    var c = ev.target.closest("[data-card]"); if (c) openSheet(c.getAttribute("data-card"));
  });
  $("#board").addEventListener("focusin", function(ev){
    var c = ev.target.closest("[data-card]"); if (c && !state.sheetOpen) state.sel = c.getAttribute("data-card");
  });
  scrim.addEventListener("click", closeSheet);
  $("#shClose").addEventListener("click", closeSheet);
  $("#shPrev").addEventListener("click", function(){ step(-1); });
  $("#shNext").addEventListener("click", function(){ step(1); });
  sheet.addEventListener("click", function(ev){
    var it = ev.target.closest("[data-item]"); if (it){ openSheet(it.getAttribute("data-item"), true); return; }
    var b = ev.target.closest("[data-copy]"); if (!b) return;
    var v = b.getAttribute("data-copy");
    var done = function(){ b.textContent = "Copied"; setTimeout(function(){ b.textContent = "Copy"; }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, function(){ selectText(); done(); });
    else { selectText(); done(); }
    function selectText(){ var el = $("#caipVal"); var rg = document.createRange(); rg.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(rg); try { document.execCommand("copy"); } catch (e) {} }
  });
  // mobile sheet: drag the handle down to close
  (function(){
    var y0 = null;
    sheet.addEventListener("touchstart", function(ev){ if (ev.target.closest(".handle,.sh-top")) y0 = ev.touches[0].clientY; }, { passive: true });
    sheet.addEventListener("touchend", function(ev){ if (y0 != null && ev.changedTouches[0].clientY - y0 > 60) closeSheet(); y0 = null; }, { passive: true });
  })();
  // mobile board: swipe between status columns
  (function(){
    var x0 = null, y0 = null;
    $("#board").addEventListener("touchstart", function(ev){ x0 = ev.touches[0].clientX; y0 = ev.touches[0].clientY; }, { passive: true });
    $("#board").addEventListener("touchend", function(ev){
      if (x0 == null || !MOBILE.matches) return;
      var dx = ev.changedTouches[0].clientX - x0, dy = ev.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5){
        var i = COLMAP[state.mcol].index + (dx < 0 ? 1 : -1); if (COLS[i]) setMCol(COLS[i].key);
      }
    }, { passive: true });
  })();

  document.addEventListener("keydown", function(ev){
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var tag = (ev.target.tagName || "").toLowerCase(); if (tag === "input" || tag === "textarea") return;
    var k = ev.key;
    if (k === "Escape"){
      if (state.sheetOpen){ ev.preventDefault(); closeSheet(); }
      return;
    }
    if (state.sheetOpen && k === "Tab"){ // keep focus inside the sheet
      var f = sheet.querySelectorAll("button:not([disabled]),a[href],summary"); f = Array.prototype.filter.call(f, function(x){ return x.offsetParent !== null; });
      if (!f.length) return;
      if (ev.shiftKey && document.activeElement === f[0]){ ev.preventDefault(); f[f.length - 1].focus(); }
      else if (!ev.shiftKey && document.activeElement === f[f.length - 1]){ ev.preventDefault(); f[0].focus(); }
      return;
    }
    if (k === "j" || k === "ArrowDown"){ ev.preventDefault(); step(1); }
    else if (k === "k" || k === "ArrowUp"){ ev.preventDefault(); step(-1); }
    else if ((k === "h" || k === "ArrowLeft") && state.view === "board"){ ev.preventDefault(); stepCol(-1); }
    else if ((k === "l" || k === "ArrowRight") && state.view === "board"){ ev.preventDefault(); stepCol(1); }
    else if ((k === "Enter" || k === " ") && !state.sheetOpen){
      var c = document.activeElement && document.activeElement.closest && document.activeElement.closest("[data-card]");
      if (c){ ev.preventDefault(); openSheet(c.getAttribute("data-card")); }
    }
    else if ((k === "v" || k === "V") && !state.sheetOpen) setView(state.view === "board" ? "list" : "board");
  });

  /* ---------- init ---------- */
  buildRegSeg(); buildMTabs(); renderFlow(); renderChrome(); render();
  function placeAll(){ syncRegSeg(false); syncViewSeg(false); syncMTabs(false); }
  placeAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeAll);
  window.addEventListener("resize", placeAll);
  function onBreakpoint(){ render(); placeAll(); }
  (MOBILE.addEventListener ? MOBILE.addEventListener("change", onBreakpoint) : MOBILE.addListener(onBreakpoint));
})();
</script>
</body>
</html>
