<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Curate Court Board</title>
<meta name="description" content="CurateVision home dashboard variant: Curate requests as a status board (open to challenge, in court, decided).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Urbanist:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#02040a;
  --frame:#0a0b0e;
  --line:rgba(255,255,255,.06);
  --line-2:rgba(255,255,255,.1);
  --line-3:rgba(255,255,255,.16);
  --text:#eef0f4;
  --text-2:#a7adba;
  --text-3:#8a92a0;
  --blue:#4f8cff;
  --blue-rgb:79,140,255;
  --amber:#f5a524;
  --neutral:#c9ced8;
  --r-frame:30px;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Urbanist", "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.36,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:13px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- aurora stage ---------- */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px) saturate(125%)}
.aurora i{position:absolute;border-radius:50%;display:block}
.aurora .a1{width:70%;height:55%;left:15%;bottom:2%;background:radial-gradient(closest-side,#2563eb 0%,rgba(37,99,235,.6) 45%,transparent 100%);animation:drift1 26s ease-in-out infinite alternate}
.aurora .a2{width:48%;height:50%;left:-4%;top:4%;background:radial-gradient(closest-side,rgba(56,189,248,.75),transparent 100%);animation:drift2 32s ease-in-out infinite alternate}
.aurora .a3{width:50%;height:52%;right:-6%;top:18%;background:radial-gradient(closest-side,rgba(99,102,241,.75),transparent 100%);animation:drift3 30s ease-in-out infinite alternate}
.aurora .a4{width:42%;height:30%;left:34%;bottom:-6%;background:radial-gradient(closest-side,rgba(125,211,252,.8),transparent 100%)}
.aurora .a5{width:40%;height:30%;left:30%;top:2%;background:radial-gradient(closest-side,rgba(59,130,246,.55),transparent 100%)}
@keyframes drift1{to{transform:translate(4%,-3%) scale(1.06)}}
@keyframes drift2{to{transform:translate(6%,5%) scale(1.1)}}
@keyframes drift3{to{transform:translate(-5%,-4%) scale(.94)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* ---------- frame ---------- */
.stage{position:relative;z-index:2;height:100dvh;padding:44px 52px 36px}
.frame{
  position:relative;height:100%;min-height:600px;
  display:grid;grid-template-rows:56px auto 1fr 36px;
  background:var(--frame);
  border-radius:var(--r-frame);
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 100px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06);
  overflow:hidden;
}
.frame::after{ /* lit from below */
  content:"";position:absolute;left:8%;right:8%;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(125,211,252,0) 5%,rgba(125,211,252,.85) 50%,rgba(125,211,252,0) 95%,transparent);
  box-shadow:0 0 18px 2px rgba(96,165,250,.45);pointer-events:none
}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:20px;padding:0 18px 0 22px;border-bottom:1px solid var(--line);background:linear-gradient(#0d0e12,#0b0c0f)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;letter-spacing:.22em;font-size:12px;color:#dfe3ea}
.brand svg{display:block}
.nav{display:flex;gap:4px;margin-left:18px;height:100%}
.nav a{position:relative;display:flex;align-items:center;padding:0 12px;color:var(--text-2);font-size:13px;font-weight:500;transition:color .2s}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:#fff}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:-1px;width:70%;height:22px;transform:translateX(-50%);
  background:radial-gradient(50% 100% at 50% 100%,rgba(var(--blue-rgb),.45),transparent 70%);pointer-events:none}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:30%;right:30%;bottom:-1px;height:1px;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.scope{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);color:var(--text-2);font-size:12px;background:#0f1115}
.scope b{font-weight:500;color:var(--text)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 14px;border-radius:10px;font-weight:500;font-size:13px;transition:transform .2s var(--ease),background .2s,box-shadow .2s}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 20px -6px rgba(var(--blue-rgb),.8),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-primary:hover{background:#6a9dff;transform:translateY(-1px)}
.btn-ghost{border:1px solid var(--line-2);background:#121419;color:var(--text)}
.btn-ghost:hover{background:#171a20;border-color:var(--line-3)}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:16px;padding:12px 18px 12px 22px;border-bottom:1px solid var(--line);min-width:0}
.tb-title{flex:none}
.tb-title h1{margin:0;font-family:var(--display);font-weight:500;font-size:20px;letter-spacing:-.01em}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}

/* segmented control (Create UI) */
.seg{position:relative;display:flex;min-width:0;max-width:100%;padding:4px;border-radius:999px;background:#151821;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.seg-scroll{overflow-x:auto;scrollbar-width:none;border-radius:999px;min-width:0}
.seg-scroll::-webkit-scrollbar{display:none}
.seg-scroll.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.seg-scroll.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
.seg-scroll.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
.seg-in{position:relative;display:flex;gap:2px;width:max-content}
.seg-ind{position:absolute;top:0;bottom:0;left:0;right:100%;border-radius:999px;background:#05060a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 1px 0 rgba(255,255,255,.04);pointer-events:none}
.seg-ind.anim{transition:left .42s var(--spring),right .42s var(--spring)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;gap:8px;height:30px;padding:0 14px;border-radius:999px;color:#969ea8;font-weight:500;font-size:13px;white-space:nowrap;transition:color .2s}
.seg button:hover{color:#d6dae1}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{color:#fff}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:20px;padding:0 6px;border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums;border:1.5px solid rgba(255,255,255,.22);color:#cfd4dc;background:rgba(255,255,255,.03)}
.cnt.blue{border-color:#2f6bff;background:#1d2844;color:#8fb2ff}
.cnt.amber{border-color:rgba(245,165,36,.55);background:rgba(245,165,36,.08);color:var(--amber)}
.seg.icons button{padding:0 10px;height:28px}
.seg.icons svg{display:block}

/* ---------- board ---------- */
.board{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:0}
.col{position:relative;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.col:last-child{border-right:0}

/* column header: one row of title + count + inline figure, one caption line */
.ch{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"title vis" "scope cap";align-items:center;column-gap:16px;row-gap:3px;padding:13px 16px 11px 18px;border-bottom:1px solid var(--line)}
.ch-title{grid-area:title;display:flex;align-items:center;gap:8px;min-width:0;height:24px}
.ch-title svg{flex:none;display:block}
.ch-title h2{margin:0;font-size:13.5px;font-weight:500;white-space:nowrap}
.ch-vis{grid-area:vis;justify-self:end;display:flex;align-items:center;height:24px}
.ch-vis svg{display:block;overflow:visible}
.ch-scope{grid-area:scope;min-width:0;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-cap{grid-area:cap;justify-self:end;font-size:12px;color:var(--text-3);white-space:nowrap}
.ch-cap b{color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}
.ch-reg{grid-area:reg;display:none}
.cnt-btn{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 4px 0 7px;border-radius:7px;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text);background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line-2);transition:background .15s,box-shadow .15s;white-space:nowrap}
.cnt-btn svg{display:block;opacity:.5;transition:opacity .15s,transform .2s var(--ease)}
.cnt-btn:hover,.cnt-btn[aria-expanded="true"]{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line-3)}
.cnt-btn:hover svg,.cnt-btn[aria-expanded="true"] svg{opacity:.9}
.cnt-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.cnt-btn:focus-visible,.ch-reg:focus-visible{outline:2px solid rgba(var(--blue-rgb),.8);outline-offset:2px}
.cnt-btn.amber{color:var(--amber)}
.cnt-btn.muted{color:var(--text-2);font-weight:400}
.svg-in .bar-g{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s var(--ease) both;animation-delay:calc(var(--k) * 16ms + 120ms)}
.svg-in .pop-in{transform-box:fill-box;transform-origin:50% 50%;animation:popin .5s var(--spring) both;animation-delay:calc(var(--k) * 45ms + 200ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes popin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}

.list{position:relative;flex:1;min-height:0;overflow-y:auto;padding:12px 12px 24px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:#23262d transparent;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent)}
.list::-webkit-scrollbar{width:8px}
.list::-webkit-scrollbar-thumb{background:#23262d;border-radius:8px;border:2px solid var(--frame)}

/* card: always three rows, same height in every column */
.cw{position:relative;flex:none;animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 38ms + var(--cd,0ms))}
.card{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;height:98px;text-align:left;padding:11px 12px;border-radius:10px;background:linear-gradient(180deg,#121419,#0f1115);
  box-shadow:inset 0 0 0 1px var(--line),0 1px 0 rgba(0,0,0,.4);transition:box-shadow .2s var(--ease),background .2s;overflow:hidden;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(var(--blue-rgb),.08),transparent 60%)}
.card:hover{background:linear-gradient(180deg,#15171d,#111318);box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),0 14px 30px -14px rgba(0,0,0,.85)}
.card:hover::before{opacity:1}
.card:focus-visible{outline:none;box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.9),0 0 0 3px rgba(var(--blue-rgb),.25)}
.card.sel{box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.75),0 0 0 3px rgba(var(--blue-rgb),.18)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.card .r{display:flex;align-items:center;gap:8px;height:20px;min-width:0}
.av{flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:.02em;color:#d5d9e1;
  background:linear-gradient(145deg,#272a33,#16181d);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.c-reg{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);font-size:12.5px}
.age{margin-left:auto;flex:none;color:var(--text-2);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .t{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t2{flex:none;font-size:12.5px;color:var(--text-3);white-space:nowrap}
.mono{font-family:var(--mono)}
.card .t.mono{font-size:13.5px;letter-spacing:-.01em}
.oi{flex:none;display:block}
.who{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;font-size:12px;color:var(--text-3);white-space:nowrap}
.who .mono{color:var(--text-2);font-size:12px}
.idn{flex:none;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1.5px var(--frame),0 0 0 2.5px rgba(255,255,255,.08)}
.where{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.card.grp .r3{padding-right:118px}

/* chain marks: monochrome, name beside */
.cm{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font:600 8.5px/1 var(--mono);letter-spacing:-.02em;color:#c6ccd6;background:#1b1e25;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.stack{display:inline-flex;align-items:center}
.stack .cm{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 0 0 2px #101216}
.stack .cm + .cm{margin-left:-5px}

/* grouped card: same address on several chains */
.xp{position:absolute;z-index:2;right:7px;top:63px;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 6px 0 5px;border-radius:8px;font-size:12px;color:var(--text-2);transition:background .15s,color .15s}
.xp:hover,.xp:focus-visible{background:rgba(255,255,255,.06);color:#fff;outline:none}
.xp:focus-visible{box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.8)}
.xp .chev{transition:transform .25s var(--ease)}
.cw.open .xp .chev{transform:rotate(180deg)}
.xw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease)}
.cw.open .xw{grid-template-rows:1fr}
.xl{min-height:0;overflow:hidden}
.cw.open .card{border-radius:10px 10px 0 0}
.xl-in{margin-top:-1px;padding:4px;border-radius:0 0 10px 10px;background:#0d0f13;box-shadow:inset 0 0 0 1px var(--line)}
.xr{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:7px;text-align:left;font-size:12.5px;color:var(--text);transition:background .15s}
.xr:hover,.xr:focus-visible{background:rgba(255,255,255,.05);outline:none}
.xr:focus-visible{box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.8)}
.xr .id{font-family:var(--mono);font-size:12px;color:var(--text-3)}
.xr .ag{font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}

.more{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;color:var(--text-3);font-size:12px;box-shadow:inset 0 0 0 1px var(--line);animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 38ms + var(--cd,0ms))}
.more a{color:var(--text-2)}
.more a:hover{color:#fff}
.empty{flex:none;padding:22px 16px;border-radius:10px;text-align:center;color:var(--text-3);font-size:12px;background:rgba(255,255,255,.015);box-shadow:inset 0 0 0 1px var(--line);animation:rise .5s var(--ease) both}
.empty b{display:block;margin-bottom:4px;color:var(--text-2);font-weight:500;font-size:13px}

/* list view */
.board.is-list{display:block;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#23262d transparent}
.lv-group{border-bottom:1px solid var(--line)}
.lv-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 22px;background:rgba(13,14,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-weight:500}
.lv-head svg{display:block}
.lv-head .cap{color:var(--text-3);font-weight:400;font-size:12px}
.lv-row{display:grid;grid-template-columns:18px minmax(170px,1fr) minmax(170px,1.2fr) 150px 170px 56px;align-items:center;gap:16px;width:100%;text-align:left;padding:0 22px;height:44px;border-bottom:1px solid rgba(255,255,255,.035);transition:background .15s;animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0) * 22ms)}
.lv-row:hover,.lv-row:focus-visible{background:rgba(255,255,255,.03);outline:none}
.lv-row:focus-visible,.lv-row.sel{box-shadow:inset 2px 0 0 var(--blue)}
.lv-row .si{display:flex;align-items:center;justify-content:center;height:100%}
.lv-row .si svg{display:block}
.lv-row .reg{display:flex;align-items:center;gap:8px;min-width:0;color:var(--text-2)}
.lv-row .reg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv-row .main{display:flex;align-items:center;gap:8px;min-width:0}
.lv-row .main .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.lv-row .main .t.mono{font-size:12.5px}
.lv-row .main .t2{color:var(--text-3);font-size:12px;white-space:nowrap}
.lv-row .where{margin-left:0}
.lv-row .when{font-size:12px;color:var(--text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.lv-row .age{margin-left:0;text-align:right}

/* ---------- status bar ---------- */
.status{display:flex;align-items:center;gap:16px;padding:0 18px 0 22px;border-top:1px solid var(--line);background:#0c0d10;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden}
.status .pill{display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 9px;border-radius:7px;background:rgba(var(--blue-rgb),.08);box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.25);color:#b8ccff}
.status .sep{width:1px;height:12px;background:var(--line-2)}
.status b{color:var(--text-2);font-weight:500;font-variant-numeric:tabular-nums}
.split{display:inline-flex;gap:2px;width:44px;height:4px;vertical-align:middle;margin:0 2px}
.split i{display:block;height:100%;border-radius:2px;background:var(--blue)}
.split i+i{background:#5b6475}
.kbd{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
kbd{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 4px;border-radius:5px;font-family:var(--mono);font-size:11px;color:var(--text-2);background:#15171c;box-shadow:inset 0 0 0 1px var(--line-2),0 1px 0 rgba(0,0,0,.5)}

/* ---------- registry popover ---------- */
.pop{position:fixed;z-index:40;width:330px;max-width:calc(100vw - 24px);padding:12px 8px 10px;border-radius:14px;background:#0e1014;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 24px 60px -20px rgba(0,0,0,.95);
  opacity:0;visibility:hidden;transform:translateY(-4px) scale(.98);transform-origin:top left;transition:opacity .16s,transform .22s var(--ease),visibility 0s .22s}
.pop.on{opacity:1;visibility:visible;transform:none;transition:opacity .16s,transform .22s var(--ease),visibility 0s}
.pop-h{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--text-3);margin:0 8px 8px}
.pop-h b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 64px 34px;align-items:center;gap:10px;width:100%;height:32px;padding:0 8px;border-radius:8px;text-align:left;font-size:12.5px;color:var(--text-2);transition:background .15s,color .15s}
.pr:hover,.pr:focus-visible{background:rgba(255,255,255,.05);color:var(--text);outline:none}
.pr .nm{display:flex;align-items:center;gap:8px;min-width:0}
.pr .nm span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .av{width:18px;height:18px;font-size:9px;border-radius:5px}
.pr .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.pr .bar i{display:block;height:100%;border-radius:2px;background:#4a5160;transition:background .15s}
.pr:hover .bar i{background:#8a92a0}
.pr.on{color:#fff}
.pr.on .bar i{background:var(--blue);box-shadow:0 0 8px rgba(var(--blue-rgb),.6)}
.pr .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--text)}
.pop-f{display:flex;justify-content:space-between;align-items:center;margin:8px 8px 0;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.pop-f button{color:var(--text-2)}
.pop-f button:hover{color:#fff}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(3,4,8,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;z-index:21;top:10px;right:10px;bottom:10px;width:420px;max-width:calc(100% - 20px);display:flex;flex-direction:column;border-radius:22px;
  background:linear-gradient(180deg,#121419,#0d0f13);box-shadow:0 0 0 1px rgba(255,255,255,.08),-30px 0 80px -20px rgba(0,0,0,.8);
  transform:translateX(calc(100% + 24px));transition:transform .45s var(--ease),visibility 0s .45s;visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
.sh-top{display:flex;align-items:center;gap:8px;padding:14px 14px 12px 18px;border-bottom:1px solid var(--line)}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:7px;font-size:12px;color:var(--text-2);background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line-2);white-space:nowrap}
.chip svg{display:block}
.chip.v{color:#b8ccff;box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.35)}
.sh-nav{margin-left:auto;display:flex;gap:4px}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2);background:#14161b;transition:background .2s,color .2s}
.ib:hover{background:#1a1d23;color:#fff}
.ib:disabled{opacity:.35;cursor:default}
.handle{display:none}
.sh-body{flex:1;overflow-y:auto;padding:18px 18px 22px;scrollbar-width:thin;scrollbar-color:#23262d transparent}
.sh-reg{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:12.5px}
.sh-title{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:22px;font-weight:500;letter-spacing:-.01em;word-break:break-all}
.sh-title.mono{font-family:var(--mono);font-size:20px}
.sh-ev{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-size:13px;color:var(--text-2)}
.sh-ev b{color:#fff;font-weight:500}
.sh-ev i{width:3px;height:3px;border-radius:50%;background:var(--text-3)}
.ctx{margin:18px 0 4px;padding:14px 14px 12px;border-radius:14px;background:rgba(255,255,255,.02);box-shadow:inset 0 0 0 1px var(--line)}
.ctx-h{font-size:12px;color:var(--text-3);margin-bottom:10px}
.ctx-h b{color:var(--text-2);font-weight:500}
.ctx > svg{display:block;width:100%;height:auto;overflow:visible}
.ctx-leg svg{display:block}
.ctx-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--text-2)}
.ctx-leg span{display:inline-flex;align-items:center;gap:6px}
.ctx .xr{padding:0 6px}
.ctx .xr.cur{background:rgba(var(--blue-rgb),.08);box-shadow:inset 0 0 0 1px rgba(var(--blue-rgb),.3)}
.props{margin:16px 0 0;display:grid;grid-template-columns:116px 1fr;font-size:12.5px}
.props dt{color:var(--text-3);padding:9px 0;border-top:1px solid var(--line)}
.props dd{margin:0;padding:9px 0;border-top:1px solid var(--line);color:var(--text);min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.props dd .mono{font-size:12px;word-break:break-all}
.props dd .dim{color:var(--text-3)}
.copy{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-size:12px;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-2);background:#15171c}
.copy:hover{color:#fff}
.sh-h{margin:22px 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3)}
.amb{margin:0 0 10px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.rg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;border-radius:12px;overflow:hidden;background:var(--line);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:8px}
.rg > div{background:#101216;padding:10px 12px}
.rg .n{font-size:17px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.rg .l{font-size:12px;color:var(--text-3);margin-top:2px}
.rg-meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.others{margin-top:10px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.others summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-size:12.5px;color:var(--text-2);cursor:pointer;list-style:none}
.others summary::-webkit-details-marker{display:none}
.others summary svg{transition:transform .2s var(--ease)}
.others[open] summary svg{transform:rotate(180deg)}
.others summary:hover{color:#fff}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-2)}
.orow b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.sh-foot{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line)}
.sh-foot .btn{flex:1}

/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;padding:8px 10px;border-radius:10px;background:#0c0e12;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 12px 30px -10px rgba(0,0,0,.9);font-size:12px;color:var(--text-2);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;max-width:280px}
.tip.on{opacity:1;transform:none}
.tip b{color:#fff;font-weight:500}
.tip .r{display:flex;justify-content:space-between;gap:14px}

/* mobile status tabs (hidden on desktop) */
.mtabs{display:none}

/* ---------- responsive ---------- */
@media (max-width: 1280px){ .kbd{display:none} .stage{padding:36px 40px 30px} }
@media (max-width: 1180px){
  .nav a.opt{display:none}
  .status .md-hide,.status .sep:has(+ .md-hide){display:none}
  .ch-scope{display:none}
  .ch{grid-template-areas:"title vis" "cap cap"}
}
@media (max-width: 860px){
  body{overflow:auto}
  .stage{height:auto;min-height:100dvh;padding:16px 14px 18px}
  .frame{height:auto;min-height:calc(100dvh - 34px);grid-template-rows:auto auto auto auto;--r-frame:24px}
  .top{height:54px;padding:0 10px 0 16px}
  .nav,.scope{display:none}
  .toolbar{flex-wrap:wrap;padding:12px 14px 12px;gap:10px}
  .tb-title{order:1}
  .tb-r{order:2;margin-left:auto}
  .mtabs{order:3;display:flex;width:100%}
  .mtabs .seg-in{width:100%}
  .mtabs button{flex:1;justify-content:center;padding:0 8px}
  .toolbar > #regSeg{order:4;width:100%}
  .board{display:block}
  .col{display:none;border-right:0}
  .col.active{display:flex;animation:swap .35s var(--ease) both}
  .col.from-l{animation-name:swapL}
  @keyframes swap{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
  @keyframes swapL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
  .ch{grid-template-areas:"cap vis" "reg vis";padding:12px 14px 10px 16px;row-gap:2px}
  .ch-title,.ch-scope{display:none}
  .ch-cap{justify-self:start}
  .ch-reg{display:inline-flex;align-items:center;gap:3px;justify-self:start;height:22px;margin-left:-6px;padding:0 6px;border-radius:7px;font-size:12px;color:var(--text-2)}
  .ch-reg svg{opacity:.6}
  .ch-reg[aria-expanded="true"]{background:rgba(255,255,255,.06);color:#fff}
  .ch-vis{height:44px}
  .list{overflow:visible;-webkit-mask-image:none;mask-image:none;padding:12px 10px 18px}
  .board.is-list{overflow:visible}
  .lv-group{display:none}
  .lv-group.active{display:block}
  .lv-head{position:static;padding:10px 16px}
  .lv-row{grid-template-columns:24px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:2px 12px;height:auto;padding:10px 16px}
  .lv-row .si,.lv-row .whocell{display:none}
  .lv-row .reg{display:contents}
  .lv-row .reg .av{grid-column:1;grid-row:1 / span 2;align-self:center}
  .lv-row .reg > span:not(.av){grid-column:2;grid-row:2;font-size:12px;color:var(--text-3)}
  .lv-row .main{grid-column:2;grid-row:1}
  .lv-row .age{grid-column:3;grid-row:1}
  .lv-row .wcell{grid-column:3;grid-row:2;justify-self:end}
  .lv-row .wcell .where span:last-child{display:none}
  .status{flex-wrap:wrap;gap:8px 12px;padding:10px 14px;height:auto;white-space:normal}
  .status .sep,.kbd,.status .xs-hide{display:none}
  .sheet{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:86dvh;border-radius:24px 24px 0 0;transform:translateY(105%)}
  .sheet.on{transform:none}
  .scrim{position:fixed}
  .handle{display:block;width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:8px auto 0}
  .sh-nav .ib.nav-btn{display:none}
  .rg{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 400px){
  .tb-title h1{font-size:18px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

    { key: "open", title: "Open to challenge", tab: "Open", items: S.openToChallenge, icon: ICON.open, badge: "", total: S.figures.requestsOpen, regField: "open",
      verb: "Requested", since: "since request", segCap: "Open requests by registry" },
    { key: "court", title: "In court", tab: "In court", items: S.inCourt, icon: ICON.court, badge: "amber", total: S.figures.inCourt, regField: "inCourt",
      verb: "Challenged", since: "since challenge", segCap: "Disputes by registry" },
    { key: "decided", title: "Decided", tab: "Decided", items: S.decided, icon: ICON.decided, badge: "muted", total: S.decided.length, regField: null,
      verb: "Resolved", since: "since ruling", segCap: "Latest 10 rulings by registry" }
  ];
  var COLMAP = {}; COLS.forEach(function(c, i){ c.index = i; COLMAP[c.key] = c; });

  // the same address requested on several chains becomes one card
  function groupOpen(items){
    var map = {}, out = [];
    items.forEach(function(e, i){
      var c = caip(e.id), k = e.registry + "|" + (c ? c.addr.toLowerCase() : i);
      if (!(k in map)){ map[k] = out.length; out.push({ lead: i, members: [] }); }
      out[map[k]].members.push(i);
    });
    return out;
  }
  function regTotals(title, field){
    return S.topRegistries.filter(function(r){ return r.title === title; }).reduce(function(a, r){ return a + (r[field] || 0); }, 0);
  }
  function segmentsFor(col){
    var map = {}, order = [];
    if (col.regField){
      S.topRegistries.forEach(function(r){
        var v = r[col.regField] || 0; if (!v) return;
        if (!(r.title in map)){ map[r.title] = 0; order.push(r.title); }
        map[r.title] += v;
      });
    } else {
      col.items.forEach(function(e){ if (!(e.registry in map)){ map[e.registry] = 0; order.push(e.registry); } map[e.registry]++; });
    }
    return order.map(function(t){ return { title: t, value: map[t] }; }).sort(function(a, b){ return b.value - a.value; });
  }
  COLS.forEach(function(c){
    c.units = c.key === "open" ? groupOpen(c.items) : c.items.map(function(e, i){ return { lead: i, members: [i] }; });
    c.unitOf = {}; c.units.forEach(function(u){ u.members.forEach(function(m){ c.unitOf[m] = u; }); });
    c.segments = segmentsFor(c);
  });

  // registry filter: registries that have cards on the board, most cards first (no counts on the chips)
  var regCount = {};
  COLS.forEach(function(c){ c.items.forEach(function(e){ regCount[e.registry] = (regCount[e.registry] || 0) + 1; }); });
  var REGS = Object.keys(regCount).sort(function(a, b){ return regCount[b] - regCount[a]; });

  // days with jurors for every dispute in court (all of them are in the snapshot)
  var COURT_DAYS = S.inCourt.map(function(e){ return (SNAP - e.at) / DAY; });
  var AX = Math.max(1, Math.ceil(Math.max.apply(null, COURT_DAYS)));
  var REQ30 = series.reduce(function(a, d){ return a + d.requests; }, 0);

  var state = { reg: "all", view: "board", mcol: "open", sel: null, item: null, sheetOpen: false, open: {}, intro: !RM };

  function matches(e){ return state.reg === "all" || e.registry === state.reg; }
  function units(col){ return col.units.filter(function(u){ return matches(col.items[u.lead]); }); }
  function colCount(col){
    if (col.key === "decided") return units(col).length;
    if (state.reg === "all") return col.total;
    return regTotals(state.reg, col.regField);
  }
  function outcomeCounts(){
    var oc = { registered: 0, rejected: 0, removed: 0 };
    S.decided.forEach(function(e){ if (matches(e)) oc[e.outcome]++; });
    return oc;
  }

  /* ---------- segmented controls ---------- */
  function placeInd(seg, btn, animate){
    var ind = seg.querySelector(".seg-ind"), inner = seg.querySelector(".seg-in");
    if (!btn || !ind || !btn.offsetWidth) return;
    var l = btn.offsetLeft, w = btn.offsetWidth, W = inner.offsetWidth, r = W - (l + w);
    var prevL = parseFloat(ind.dataset.l || "-1");
    if (animate && !RM && prevL >= 0){
      var right = l > prevL;
      ind.classList.add("anim");
      ind.style.transition = right ? "right .32s var(--spring), left .46s var(--spring) .05s" : "left .32s var(--spring), right .46s var(--spring) .05s";
    } else { ind.style.transition = "none"; }
    ind.style.left = l + "px"; ind.style.right = r + "px"; ind.dataset.l = l;
    var sc = seg.querySelector(".seg-scroll");
    if (sc && sc.scrollWidth > sc.clientWidth){
      sc.scrollTo({ left: l - (sc.clientWidth - w) / 2, behavior: RM || !animate ? "auto" : "smooth" });
    }
  }
  function updFade(sc){
    var over = sc.scrollWidth > sc.clientWidth + 2;
    sc.classList.toggle("fade-l", over && sc.scrollLeft > 2);
    sc.classList.toggle("fade-r", over && sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 2);
  }

  function buildRegSeg(){
    var seg = $("#regSeg"), inner = seg.querySelector(".seg-in");
    var html = '<span class="seg-ind"></span><button type="button" data-reg="all" aria-pressed="true">All registries</button>';
    REGS.forEach(function(t){
      html += '<button type="button" data-reg="' + esc(t) + '" aria-pressed="false" title="Show only ' + esc(t) + '">' + esc(shortName(t)) + '</button>';
    });
    inner.innerHTML = html;
    inner.addEventListener("click", function(ev){
      var b = ev.target.closest("button"); if (!b) return;
      setReg(b.getAttribute("data-reg"));
    });
    var sc = seg.querySelector(".seg-scroll");
    sc.addEventListener("scroll", function(){ updFade(sc); }, { passive: true });
  }
  function syncRegSeg(animate){
    var seg = $("#regSeg"), btn = null;
    seg.querySelectorAll("button").forEach(function(b){
      var on = b.getAttribute("data-reg") === state.reg; b.setAttribute("aria-pressed", on); if (on) btn = b;
    });
    placeInd(seg, btn, animate);
    var sc = seg.querySelector(".seg-scroll"); updFade(sc);
    if (animate) setTimeout(function(){ updFade(sc); }, 420);
  }
  function setReg(r){
    if (state.reg === r) return;
    state.reg = r; closePop(); syncRegSeg(true); render();
  }

  function buildMTabs(){
    var inner = $("#mtabs .seg-in");
    var html = '<span class="seg-ind"></span>';
    COLS.forEach(function(c){
      var badge = c.key === "decided" ? "" : '<span class="cnt ' + (c.key === "open" ? "blue" : "amber") + '" data-mcount="' + c.key + '">' + fmt(colCount(c)) + '</span>';
      html += '<button type="button" role="tab" data-col="' + c.key + '" aria-selected="' + (c.key === state.mcol) + '">' + c.tab + badge + '</button>';
    });
    inner.innerHTML = html;
    inner.addEventListener("click", function(ev){
      var b = ev.target.closest("button"); if (!b) return; setMCol(b.getAttribute("data-col"));
    });
  }
  function syncMTabs(animate){
    var seg = $("#mtabs"), btn = null;
    seg.querySelectorAll("button").forEach(function(b){ var on = b.getAttribute("data-col") === state.mcol; b.setAttribute("aria-selected", on); if (on) btn = b; });
    seg.querySelectorAll("[data-mcount]").forEach(function(el){ el.textContent = fmt(colCount(COLMAP[el.getAttribute("data-mcount")])); });
    if (MOBILE.matches) placeInd(seg, btn, animate);
  }
  function setMCol(k){
    if (state.mcol === k) return;

    state.mcol = k; closePop(); syncMTabs(true);
    document.querySelectorAll("[data-colwrap]").forEach(function(el){
      var on = el.getAttribute("data-colwrap") === k;
      el.classList.toggle("active", on); el.classList.toggle("from-l", on && fromLeft);
    });
  }

  function syncViewSeg(animate){
    var seg = $("#viewSeg"), btn = null;
    seg.querySelectorAll("button").forEach(function(b){ var on = b.getAttribute("data-view") === state.view; b.setAttribute("aria-pressed", on); if (on) btn = b; });
    placeInd(seg, btn, animate);
  }
  $("#viewSeg").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if (!b) return; setView(b.getAttribute("data-view"));
  });
  function setView(v){ if (state.view === v) return; state.view = v; closePop(); syncViewSeg(true); render(); }

  /* ---------- header figures (each says what it measures) ---------- */
  // Open: requests per UTC day, last 30 days, all registries
  function sparkBars(){
    var W = MOBILE.matches ? 150 : 124, H = 24, n = series.length, gap = 1.6, bw = (W - gap * (n - 1)) / n;
    var max = Math.max.apply(null, series.map(function(d){ return d.requests; })) || 1, dim = state.reg !== "all";
    var out = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Requests per day, last 30 days, ' + fmt(REQ30) + ' in total"' + (dim ? ' style="opacity:.45"' : '') + '>';
    series.forEach(function(d, i){
      var v = d.requests, x = i * (bw + gap), h = v ? Math.max(2, (v / max) * (H - 1)) : 1;
      out += '<rect class="bar-g" style="--k:' + i + (v ? ';filter:drop-shadow(0 0 2px rgba(79,140,255,.5))' : '') + '" x="' + x.toFixed(2) + '" y="' + (H - h).toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + h.toFixed(2) + '" rx="1" fill="' + (v ? "var(--blue)" : "rgba(255,255,255,.14)") + '"/>';
      out += '<rect data-tip-day="' + i + '" x="' + (x - gap / 2).toFixed(2) + '" y="0" width="' + (bw + gap).toFixed(2) + '" height="' + H + '" fill="transparent"/>';
    });
    return out + '</svg>';
  }
  // In court: one dot per dispute, placed by days since its challenge (0 to AX days)
  function courtStrip(o){
    o = o || {};
    var W = o.W || (MOBILE.matches ? 168 : 150), H = o.H || 24, big = !!o.big, r = big ? 4.5 : 2.7, step = big ? 11 : 6, padX = big ? 8 : 4;
    var base = big ? H - 22 : H - 3, x0 = padX, x1 = W - padX;
    var out = '<svg ' + (big ? '' : 'width="' + W + '" height="' + H + '" ') + 'viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Days since challenge for each of the ' + S.inCourt.length + ' disputes in court, axis 0 to ' + AX + ' days">';
    out += '<line x1="' + x0 + '" y1="' + (base + .5) + '" x2="' + x1 + '" y2="' + (base + .5) + '" stroke="rgba(255,255,255,.16)"/>';
    for (var d = 0; d <= AX; d++){
      var tx = x0 + (d / AX) * (x1 - x0);
      out += '<line x1="' + tx.toFixed(1) + '" y1="' + (base + 1) + '" x2="' + tx.toFixed(1) + '" y2="' + (base + (big ? 5 : 3)) + '" stroke="rgba(255,255,255,' + (d === 0 || d === AX ? .4 : .2) + ')"/>';
      if (big && (d % 2 === 0 || AX <= 6)) out += '<text x="' + tx.toFixed(1) + '" y="' + (H - 2) + '" text-anchor="middle" font-size="12" fill="#8a92a0" font-family="Geist, sans-serif">' + d + (d === AX ? " d" : "") + '</text>';
    }
    var placed = [];
    S.inCourt.map(function(e, i){ return { i: i, x: x0 + (COURT_DAYS[i] / AX) * (x1 - x0) }; })
      .sort(function(a, b){ return a.x - b.x; })
      .forEach(function(p, k){
        var lvl = 0; while (placed.some(function(q){ return q.lvl === lvl && Math.abs(q.x - p.x) < r * 2 + 1; })) lvl++;
        placed.push({ x: p.x, lvl: lvl });
        var y = base - r - 2 - lvl * step, e = S.inCourt[p.i], on = matches(e), hi = o.hi === p.i;
        var fill = hi ? "#fff" : "var(--blue)";
        out += '<circle class="pop-in" style="--k:' + k + '" cx="' + p.x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="' + fill + '" opacity="' + (big ? (hi ? 1 : .55) : (on ? 1 : .2)) + '"' + (on || big ? ' filter="drop-shadow(0 0 3px rgba(79,140,255,.75))"' : '') + '/>';
        if (hi) out += '<circle cx="' + p.x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (r + 3.5) + '" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1"/>';
        out += '<circle data-tip-court="' + p.i + '" cx="' + p.x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (r + 4) + '" fill="transparent"/>';
      });
    return out + '</svg>';
  }
  // Decided: the latest 10 rulings, one cell each, grouped by outcome
  function outcomeCells(o){
    o = o || {};
    var cs = o.cell || 13, gap = o.gap || 3, n = S.decided.length, W = n * cs + (n - 1) * gap, H = o.H || 24, y = (H - cs) / 2, big = !!o.big;
    var order = S.decided.map(function(e, i){ return i; }).sort(function(a, b){
      var d = OUT_ORDER.indexOf(S.decided[a].outcome) - OUT_ORDER.indexOf(S.decided[b].outcome);
      return d || S.decided[b].at - S.decided[a].at;
    });
    var out = '<svg ' + (big ? '' : 'width="' + W + '" height="' + H + '" ') + 'viewBox="-3 0 ' + (W + 6) + ' ' + H + '" role="img" aria-label="Outcome of each of the latest 10 rulings">';
    order.forEach(function(i, k){
      var e = S.decided[i], oo = OUT[e.outcome], x = k * (cs + gap), on = big || matches(e), hi = o.hi === i, c = cs / 2;
      out += '<g class="pop-in" style="--k:' + k + '" opacity="' + (on ? (big && o.hi != null && !hi ? .55 : 1) : .2) + '"><g transform="translate(' + x + ' ' + y + ')">' +
        '<rect x="' + (oo.fill === "none" ? .65 : 0) + '" y="' + (oo.fill === "none" ? .65 : 0) + '" width="' + (oo.fill === "none" ? cs - 1.3 : cs) + '" height="' + (oo.fill === "none" ? cs - 1.3 : cs) + '" rx="' + (cs * .28) + '" fill="' + oo.fill + '"' + (oo.fill === "none" ? ' stroke="#7c8494" stroke-width="1.3"' : '') + (e.outcome === "registered" ? ' filter="drop-shadow(0 0 3px rgba(79,140,255,.7))"' : '') + '/>' +
        oo.glyph(c, cs) + '</g></g>';
      if (hi) out += '<rect x="' + (x - 3) + '" y="' + (y - 3) + '" width="' + (cs + 6) + '" height="' + (cs + 6) + '" rx="' + (cs * .28 + 3) + '" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1"/>';
      out += '<rect data-tip-ruling="' + i + '" x="' + (x - gap / 2) + '" y="0" width="' + (cs + gap) + '" height="' + H + '" fill="transparent"/>';
    });
    return out + '</svg>';
  }

  function headScope(col){
    if (col.key === "decided"){
      var oc = outcomeCounts(), n = units(col).length;
      if (!n) return "none of the latest 10";
      var parts = OUT_ORDER.filter(function(k){ return oc[k]; }).sort(function(a, b){ return oc[b] - oc[a]; });
      if (state.reg === "all") return oc[parts[0]] + " of 10 " + OUT[parts[0]].label.toLowerCase();
      return n + " of the latest 10 · " + parts.map(function(k){ return oc[k] + " " + OUT[k].label.toLowerCase(); }).join(", ");
    }
    if (state.reg === "all") return col.key === "open" ? "open requests, all lists" : "disputes before jurors";
    return fmt(colCount(col)) + " of " + fmt(col.total) + (col.key === "open" ? " open requests" : " disputes");
  }
  function headCaption(col){
    if (col.key === "open") return 'Requests/day · 30d · ' + (state.reg === "all" ? '<b>' + fmt(REQ30) + '</b>' : 'all lists');
    if (col.key === "court") return 'Days since challenge · 0–' + AX + ' d';
    return 'Outcome · latest 10 rulings';
  }
  function header(col){
    var label = col.key === "decided" ? "latest 10" : fmt(colCount(col));
    var aria = col.key === "decided" ? "Latest 10 rulings: breakdown by registry" : fmt(colCount(col)) + " " + (col.key === "open" ? "open requests" : "disputes") + ": breakdown by registry";
    return '<div class="ch">' +
      '<div class="ch-title">' + col.icon + '<h2 id="h-' + col.key + '">' + col.title + '</h2>' +
        '<button type="button" class="cnt-btn ' + col.badge + '" data-pop="' + col.key + '" aria-haspopup="dialog" aria-expanded="false" aria-label="' + esc(aria) + '">' + label + CHEV + '</button></div>' +
      '<div class="ch-vis">' + (col.key === "open" ? sparkBars() : col.key === "court" ? courtStrip() : outcomeCells()) + '</div>' +
      '<div class="ch-scope">' + esc(headScope(col)) + '</div>' +
      '<div class="ch-cap">' + headCaption(col) + '</div>' +
      '<button type="button" class="ch-reg" data-pop="' + col.key + '" aria-haspopup="dialog" aria-expanded="false">By registry' + CHEV + '</button>' +
    '</div>';
  }

  /* ---------- cards ---------- */
  function who(e){ return '<span class="who">by <i class="idn" style="' + identicon(e.actor) + '"></i><span class="mono">' + esc(e.actor) + '</span></span>'; }
  function mainLine(col, e){
    if (col.key === "open"){ var c = caip(e.id); return '<span class="t mono">' + shortAddr(c.addr) + '</span>'; }
    if (col.key === "court") return '<span class="t">' + esc(e.status) + '</span>';
    return outIcon(e.outcome, 14) + '<span class="t">' + OUT[e.outcome].label + '</span><span class="t2">by ruling</span>';
  }
  function chainsOf(u, col){ return u.members.map(function(m){ return caip(col.items[m].id).chain; }); }
  function stack(ids, max){
    max = max || 3; var s = ids.slice(0, max).map(mark).join("");
    return '<span class="stack" aria-hidden="true">' + s + '</span>';
  }
  function cardLabel(col, u){
    var e = col.items[u.lead], sec = SNAP - e.at;
    var what = col.key === "open" ? shortAddr(caip(e.id).addr) + (u.members.length > 1 ? " on " + u.members.length + " chains" : " on " + chainOf(caip(e.id).chain).name)
      : col.key === "court" ? e.status : e.status;
    return col.title + ": " + shortName(e.registry) + ", " + what + ", " + ageLong(sec) + " " + col.since;
  }
  function card(col, u, i){
    var e = col.items[u.lead], sec = SNAP - e.at, grp = u.members.length > 1, id = col.key + ":" + u.lead, r3r = "";
    if (col.key === "open" && !grp){ var ch = caip(e.id).chain; r3r = '<span class="where">' + mark(ch) + '<span>' + esc(chainOf(ch).name) + '</span></span>'; }
    var html = '<div class="cw' + (state.open[id] ? ' open' : '') + '" style="--i:' + i + ';--cd:' + (col.index * 70) + 'ms">' +
      '<button type="button" class="card' + (grp ? ' grp' : '') + '" data-card="' + id + '" aria-label="' + esc(cardLabel(col, u)) + '">' +
        '<div class="r"><span class="av" aria-hidden="true">' + initials(e.registry) + '</span><span class="c-reg">' + esc(shortName(e.registry)) + '</span><span class="age" data-tip-age="' + col.key + ':' + u.lead + '">' + ageShort(sec) + '</span></div>' +
        '<div class="r">' + mainLine(col, e) + '</div>' +
        '<div class="r r3">' + who(e) + r3r + '</div>' +
      '</button>';
    if (grp){
      var ids = chainsOf(u, col), xid = "xl-" + u.lead;
      html += '<button type="button" class="xp" data-xp="' + id + '" aria-expanded="' + !!state.open[id] + '" aria-controls="' + xid + '" data-tip-chains="' + u.lead + '">' + stack(ids) + '<span>' + ids.length + ' chains</span>' + CHEV + '</button>' +
        '<div class="xw"><div class="xl" id="' + xid + '"' + (state.open[id] ? '' : ' inert') + '><div class="xl-in">' +
        u.members.map(function(m){
          var it = col.items[m], c = caip(it.id);
          return '<button type="button" class="xr" data-item="open:' + m + '">' + mark(c.chain) + '<span>' + esc(chainOf(c.chain).name) + '</span><span class="id">' + c.ns + ':' + c.chain + '</span><span class="ag">' + ageShort(SNAP - it.at) + '</span></button>';
        }).join("") + '</div></div></div>';
    }
    return html + '</div>';
  }

  /* ---------- render ---------- */
  function renderBoard(){
    var board = $("#board");
    board.classList.remove("is-list");
    board.classList.toggle("svg-in", state.intro);
    board.innerHTML = COLS.map(function(col){
      var us = units(col), count = colCount(col), shownReq = 0;
      us.forEach(function(u){ shownReq += u.members.length; });
      var list = us.map(function(u, i){ return card(col, u, i); }).join("");
      if (!us.length){
        list = '<div class="empty"><b>' + (col.key === "court" ? "No disputes in court" : col.key === "open" ? "Not among the 10 latest requests" : "No ruling among the latest 10") + '</b>' +
          (col.key === "open" && count ? fmt(count) + " open requests in " + esc(shortName(state.reg)) + ' · <a href="#" style="color:var(--text-2)">View all</a>' : esc(shortName(state.reg))) + '</div>';
      }
      if (col.key === "open" && us.length && count - shownReq > 0){
        list += '<div class="more" style="--i:' + us.length + ';--cd:0ms"><span>+' + fmt(count - shownReq) + ' older open requests</span><a href="#">View all →</a></div>';
      }
      if (col.key === "decided" && us.length){
        list += '<div class="more" style="--i:' + us.length + ';--cd:140ms"><span>Older rulings</span><a href="#">History →</a></div>';

        header(col) + '<div class="list" data-list="' + col.key + '">' + list + '</div></section>';

  }

  function renderList(){
    var board = $("#board");
    board.classList.add("is-list");
    board.classList.remove("svg-in");
    var n = 0;
    board.innerHTML = COLS.map(function(col){
      var us = units(col), count = colCount(col);
      var rows = us.map(function(u){
        var e = col.items[u.lead], grp = u.members.length > 1, where;
        if (col.key === "open"){
          var ids = chainsOf(u, col);
          where = grp ? '<span class="where">' + stack(ids) + '<span>' + ids.length + ' chains</span></span>' : '<span class="where">' + mark(ids[0]) + '<span>' + esc(chainOf(ids[0]).name) + '</span></span>';
        } else where = '<span class="when">' + dShort(e.at) + ' · ' + dTime(e.at) + ' UTC</span>';
        return '<button type="button" class="lv-row" data-card="' + col.key + ':' + u.lead + '" style="--i:' + (n++) + '" aria-label="' + esc(cardLabel(col, u)) + '">' +
          '<span class="si">' + col.icon + '</span>' +
          '<span class="reg"><span class="av" aria-hidden="true">' + initials(e.registry) + '</span><span>' + esc(shortName(e.registry)) + '</span></span>' +
          '<span class="main">' + mainLine(col, e) + '</span>' +
          '<span class="whocell">' + who(e) + '</span>' +
          '<span class="wcell">' + where + '</span>' +
          '<span class="age" data-tip-age="' + col.key + ':' + u.lead + '">' + ageShort(SNAP - e.at) + '</span>' +
        '</button>';

  function closeSheet(){

  function step(dir){

  document.addEventListener("keydown", function(ev){

  (MOBILE.addEventListener ? MOBILE.addEventListener("change", onBreakpoint) : MOBILE.addListener(onBreakpoint));
})();
